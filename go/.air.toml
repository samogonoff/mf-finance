# air — hot reload для Go в dev-контейнере.
# Если убрать этот файл, go-api будет стартовать через `go run ./cmd/api` (без reload).

root = "."
testdata_dir = "testdata"
tmp_dir = ".tmp"

[build]
  cmd = "go build -o ./.tmp/api ./cmd/api"
  bin = "./.tmp/api"
  include_ext = ["go"]
  exclude_dir = [".tmp", "vendor", "testdata"]
  delay = 800
  stop_on_error = false
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = false
  main_only = false

[color]
  app = "blue"
  build = "yellow"
  runner = "green"
