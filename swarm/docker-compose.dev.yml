# Finance Cabinet — dev-контур.
#
# Запуск:  cd swarm && make up
#
# Сети:
#   - finance_dev_network — общая сеть для всех сервисов dev-контура
#   - data_net — приватная сеть postgres ↔ python-analytics
#                (python-сandbox не должен ходить в Go и наоборот)
#
# Имена контейнеров фиксируем (container_name), чтобы make-таргеты
# работали детерминированно: `docker exec -it swarm-go-api-1 ...`

services:

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=finance
      - POSTGRES_PASSWORD=finance
      - POSTGRES_DB=finance
      - PGDATA=/var/lib/postgresql/data/finance/
    restart: on-failure
    volumes:
      - db_data:/var/lib/postgresql/data:rw
      - ../migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    ports:
      - "55432:5432"
    networks:
      - finance_dev_network
      - data_net

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_data:/data
    networks:
      - finance_dev_network
    ports:
      - "63791:6379"

  # ClickHouse — аналитический слой для отчётов финансиста. На первом этапе
  # питает «Задолженность ВГО» через ETL из MSSQL Premaster1C (см. clickhouse-design.md).
  # Миграции (clickhouse/migrations/*.up.sql) монтируются как init-скрипты —
  # применяются автоматически при первом старте volume.
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: swarm-finance-clickhouse-1
    environment:
      - CLICKHOUSE_DB=finance
      - CLICKHOUSE_USER=finance
      - CLICKHOUSE_PASSWORD=finance
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - ch_data:/var/lib/clickhouse
      # Только up-миграции применяются init-стартом. Монтируем по одной, чтобы
      # down.sql не попал в /docker-entrypoint-initdb.d/.
      - ../clickhouse/migrations/001_init_finance.up.sql:/docker-entrypoint-initdb.d/001_init_finance.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "58123:8123"   # HTTP
      - "59000:9000"   # native protocol
    networks:
      - finance_dev_network
    restart: on-failure

  go-api:
    build:
      context: ..
      dockerfile: swarm/go-api/Dockerfile.dev
    working_dir: /var/www/finance/go
    volumes:
      - ../go:/var/www/finance/go
      - go_modcache:/go/pkg/mod
      - bugtracker_uploads:/var/lib/finance/uploads
    # Подцепляем корневой .env, чтобы локальные секреты (OLAP_*, prod
    # site_api, и т.п.) попадали внутрь без дублирования в environment.
    env_file:
      - ../.env
    environment:
      # go.mod в репо требует go >= 1.25.7, базовый образ golang:1.22-alpine.
      # GOTOOLCHAIN=auto заставит go подтянуть нужный toolchain (одноразово,
      # кешируется в go_modcache volume).
      - GOTOOLCHAIN=auto
      - HTTP_ADDR=:8080
      - POSTGRES_URL=postgres://finance:finance@postgres:5432/finance?sslmode=disable
      - REDIS_ADDR=redis:6379
      - CORS_ORIGINS=http://finance.local,http://finance.local:3001,http://localhost:3001,http://localhost
      # «Задолженность ВГО» — таблица [FinDWH].[dbo].[Premaster1C] на OLAP 10.10.6.15.
      # В dev по умолчанию DEBT_MOCK=1; для live-режима задать MSSQL_PREMASTER_{SERVER,USER,PASSWORD}.
      # Имена БД/схемы/таблиц вынесены в env, чтобы переключаться на снэпшоты без правки кода.
      - DEBT_MOCK=${DEBT_MOCK:-1}
      - MSSQL_PREMASTER_SERVER=${MSSQL_PREMASTER_SERVER:-}
      - MSSQL_PREMASTER_PORT=${MSSQL_PREMASTER_PORT:-1433}
      - MSSQL_PREMASTER_DB=${MSSQL_PREMASTER_DB:-FinDWH}
      - MSSQL_PREMASTER_SCHEMA=${MSSQL_PREMASTER_SCHEMA:-dbo}
      - MSSQL_PREMASTER_TABLE=${MSSQL_PREMASTER_TABLE:-Premaster1C}
      - MSSQL_PREMASTER_OBJECTS_TABLE=${MSSQL_PREMASTER_OBJECTS_TABLE:-Objects}
      - MSSQL_PREMASTER_USER=${MSSQL_PREMASTER_USER:-}
      - MSSQL_PREMASTER_PASSWORD=${MSSQL_PREMASTER_PASSWORD:-}
      # ClickHouse — аналитический слой (см. clickhouse-design.md, cmd/debt-bootstrap).
      # DEBT_BACKEND=mssql (default) | ch — переключает источник свёртки отчёта.
      - DEBT_BACKEND=${DEBT_BACKEND:-mssql}
      - CLICKHOUSE_HTTP_URL=${CLICKHOUSE_HTTP_URL:-http://clickhouse:8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-finance}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-finance}
      # Bug tracker — каталог хранения скриншотов (named volume).
      - BUGTRACKER_UPLOADS_DIR=/var/lib/finance/uploads/bugtracker
      # Internal channel для python-cost (см. /internal/notifications).
      # Совпадает с INTERNAL_SERVICE_TOKEN у python-cost.
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
      # Дублирование уведомлений в Б24 через mfportal site_api (как в MP).
      # Включается, когда заданы ВСЕ три переменные. В dev по умолчанию пусто,
      # автоматически делает канал «prod-only».
      - SITE_API_NOTIFY_URL=${SITE_API_NOTIFY_URL:-}
      - SITE_API_NOTIFY_USER=${SITE_API_NOTIFY_USER:-}
      - SITE_API_NOTIFY_PASSWORD=${SITE_API_NOTIFY_PASSWORD:-}
      # Тактические планы. PLANS_MOCK=1 в dev: факт МП из фикстур (витрина
      # ALL_view_МП пока не заведена в Budgeting/FinDWH — см. mp-source-investigation.md).
      - PLANS_MOCK=${PLANS_MOCK:-1}
      - PLANS_AUDIT_ENABLED=${PLANS_AUDIT_ENABLED:-1}
    restart: on-failure
    depends_on:
      - postgres
      - redis
    networks:
      - finance_dev_network
    ports:
      - "8081:8080"

  nuxt:
    build:
      context: ..
      dockerfile: swarm/nuxt/Dockerfile.dev
    working_dir: /var/www/nuxt_app
    # extends "../python/cost/nuxt-layer" в nuxt.config.ts требует, чтобы
    # каталог раздела был виден из контейнера nuxt по тому же относительному
    # пути, что и на хосте. Монтируем read-only — основной разработчик
    # этого раздела не правит.
    volumes:
      - ../nuxt:/var/www/nuxt_app
      - ../python/cost:/var/www/python/cost:ro
      - nuxt_node_modules:/var/www/nuxt_app/node_modules
    env_file:
      - ../.env
    environment:
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
      - CHOKIDAR_USEPOLLING=true
      # Server-side запросы из Nuxt (callback B24 и пр.) ходят в Go-API напрямую
      # через docker-сеть, минуя nginx — иначе нужен отдельный nginx-server для
      # имени хоста "go-api"/"nginx". Public-fetch с фронта идёт через
      # NUXT_PUBLIC_API_BASE → api.finance.local.
      - NUXT_INTERNAL_API_BASE=http://go-api:8080
    ports:
      - "3001:3000"
    depends_on:
      - go-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - finance_dev_network

  python-analytics:
    build:
      context: ..
      dockerfile: swarm/python-analytics/Dockerfile.dev
    working_dir: /var/www/analytics
    volumes:
      - ../python:/var/www/analytics
    environment:
      - PORT=8090
      - ANALYTICS_DATABASE_URL=postgres://analytics_ro:analytics_ro@postgres:5432/finance?sslmode=disable
    restart: on-failure
    depends_on:
      - postgres
    networks:
      - data_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.dev
    ports:
      - "80:80"
    depends_on:
      go-api:
        condition: service_started
      nuxt:
        condition: service_healthy
    networks:
      - finance_dev_network

volumes:
  db_data:
  redis_data:
  nuxt_node_modules:
  go_modcache:
  bugtracker_uploads:
  ch_data:

networks:
  finance_dev_network:
    driver: bridge
  data_net:
    driver: bridge
