  \u043D\u043E)')) COLLATE \"C\" AS level01_wf,\n  -- MP5: dummy-\u043A\u043E\u043B\
  \u043E\u043D\u043A\u0430 \u0444\u0438\u043B\u044C\u0442\u0440\u0430 \xAB\u0423\u0440\
