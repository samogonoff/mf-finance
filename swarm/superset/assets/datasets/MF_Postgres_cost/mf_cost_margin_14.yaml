  \ \u043F\u0443\u0441\u0442\u044B\u0435 \u0432\u043D\u0438\u0437\u0443). \u041F\u043B\
  \u0430\u0433\u0438\u043D waterfall \u0441\u043E\u0440\u0442\u0438\u0440\u0443\u0435\
  \u0442 \u0448\u0430\u0433\u0438 \u043F\u043E \u0437\u043D\u0430\u0447\u0435\u043D\
  \u0438\u044E \u043E\u0441\u0438 X (ORDER BY \u2026 ASC), \u043F\u043E\u044D\u0442\
  \u043E\u043C\u0443\n-- \u0440\u0430\u043D\u0433 \u0437\u0430\u0448\u0438\u0442 \u0432\
  \ \u0441\u0430\u043C\u0443 \u043F\u043E\u0434\u043F\u0438\u0441\u044C: level01_wf\
  \ = U+200B \xD7 \u0440\u0430\u043D\u0433 + Level 01, \u0441\u0440\u0430\u0432\u043D\
  \u0435\u043D\u0438\u0435 \u043F\u043E \u0431\u0430\u0439\u0442\u0430\u043C\n-- (COLLATE\
  \ \"C\"). \u0420\u0430\u043D\u0433 \u0441\u0447\u0438\u0442\u0430\u0435\u0442\u0441\
  \u044F \u043F\u043E \u043E\u0442\u0444\u0438\u043B\u044C\u0442\u0440\u043E\u0432\
  \u0430\u043D\u043D\u044B\u043C \u0441\u0442\u0440\u043E\u043A\u0430\u043C: \u0443\
  \u0441\u043B\u043E\u0432\u0438\u044F \u0444\u0438\u043B\u044C\u0442\u0440\u043E\u0432\
  \ \u0434\u0430\u0448\u0431\u043E\u0440\u0434\u0430 \u0438\n-- \u043A\u0440\u043E\
  \u0441\u0441-\u0444\u0438\u043B\u044C\u0442\u0440\u043E\u0432 \u043F\u043E\u0432\
  \u0442\u043E\u0440\u0435\u043D\u044B \u043C\u0430\u043A\u0440\u043E\u0441\u043E\u043C\
  \ flt() \u0447\u0435\u0440\u0435\u0437 get_filters(); \u0437\u043D\u0430\u0447\u0435\
  \u043D\u0438\u044F \u0438\u0434\u0443\u0442 \u0432 SQL \u0442\u043E\u043B\u044C\u043A\
  \u043E\n-- \u0447\u0435\u0440\u0435\u0437 where_in (\u044D\u043A\u0440\u0430\u043D\
  \u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 SQLAlchemy). \u041E\u0448\u0438\
  \u0431\u043A\u0430 \u0432 \u0440\u0430\u043D\u0433\u0435 \u043C\u0435\u043D\u044F\
  \u0435\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u043F\u043E\u0440\u044F\u0434\
  \u043E\u043A \u0448\u0430\u0433\u043E\u0432,\n-- \u043D\u0435 \u0438\u0445 \u0432\
  \u0435\u043B\u0438\u0447\u0438\u043D\u0443.\n{% macro flt(col, expr) -%}\n{%- for\
  \ f in get_filters(col) -%}\n{%- set v = f.val if (f.val is iterable and f.val is\
  \ not string) else [f.val] -%}\n{%- if f.op in ['IN', '=='] %} AND {{ expr }} IN\
  \ {{ v | where_in }}\n{%- elif f.op in ['NOT IN', '!='] %} AND {{ expr }} NOT IN\
  \ {{ v | where_in }}\n{%- endif -%}\n{%- endfor -%}\n{%- endmacro %}\n-- MP5: \u0432\
  \u0441\u0435 \u0444\u0438\u043B\u044C\u0442\u0440\u044B \u0434\u0430\u0448\u0431\
  \u043E\u0440\u0434\u0430 \u0438 \u043A\u0440\u043E\u0441\u0441-\u0444\u0438\u043B\
  \u044C\u0442\u0440\u044B \u0438\u0437\u043C\u0435\u0440\u0435\u043D\u0438\u0439\
  \ \u043E\u0434\u043D\u0438\u043C \u043C\u0430\u043A\u0440\u043E\u0441\u043E\u043C\
  \ (\u0434\u043B\u044F \u0440\u0430\u043D\u0433\u043E\u0432 rkm \u0438 rkd \u043D\
  \u0438\u0436\u0435).\n{% macro all_flt() -%}\n{{ flt('prod_year', \"to_char(m, 'YYYY')\"\
  ) }}{{ flt('prod_month_label', \"(ARRAY['\u044F\u043D\u0432\u0430\u0440\u044C','\u0444\
  \u0435\u0432\u0440\u0430\u043B\u044C','\u043C\u0430\u0440\u0442','\u0430\u043F\u0440\
  \u0435\u043B\u044C','\u043C\u0430\u0439','\u0438\u044E\u043D\u044C','\u0438\u044E\
  \u043B\u044C','\u0430\u0432\u0433\u0443\u0441\u0442','\u0441\u0435\u043D\u0442\u044F\
  \u0431\u0440\u044C','\u043E\u043A\u0442\u044F\u0431\u0440\u044C','\u043D\u043E\u044F\
  \u0431\u0440\u044C','\u0434\u0435\u043A\u0430\u0431\u0440\u044C'])[extract(month\
  \ FROM m)::int]\") }}{{ flt('prod_month_axis', month_axis('m')) }}{{ flt('plan_id',\
  \ 'plan_id') }}{{ flt('brand_manager', 'brand_manager') }}{{ flt('level01', 'level01')\
  \ }}{{ flt('level02', 'level02') }}{{ flt('level03', 'level03') }}{{ flt('level04',\
  \ 'level04') }}{{ flt('level05', 'level05') }}{{ flt('model_name', 'model_name')\
  \ }}{{ flt('model', 'model') }}{{ flt('articul', 'articul') }}{{ flt('zadanie',\
  \ 'zadanie') }}{{ flt('country', 'country') }}{{ flt('season', 'season') }}\n{%-\
  \ endmacro %}\nWITH src AS (\n  SELECT\n    date_trunc('month', c.production_date)::date\
  \ AS m,\n    c.brand_manager, c.level01, c.level02, c.level03, c.level04, c.level05,\
  \ c.model_name, c.model, c.articul, c.country, c.season, c.zadanie, c.plan_id,\n\
  \    c.volume_pcs                                                         AS vol,\n\
  \    c.volume_pcs * c.wholesale_price_{{ sfx }}                               AS\
  \ rev,\n    {% if basis == '\u0424\u0430\u043A\u0442' %}\n    c.volume_pcs * coalesce(CASE\
  \ WHEN {{ fact_ok }} THEN c.cost_fact_{{ sfx }} END, c.cost_{{ sfx }}) AS cost,\n\
  \    {% else %}\n    c.volume_pcs * c.cost_{{ sfx }}                           \
  \               AS cost,\n    {% endif %}\n    c.volume_pcs * (coalesce(c.mat_main_{{\
  \ sfx }}, 0) + coalesce(c.mat_aux_{{ sfx }}, 0)) AS raw,\n    -- \u041F\u0440\u043E\
  \u0446\u0435\u043D\u0442\u044B \u0441\u0447\u0438\u0442\u0430\u044E\u0442\u0441\u044F\
  \ \u0432 BYN \u043F\u0440\u0438 \u043B\u044E\u0431\u043E\u0439 \u0432\u0430\u043B\
  \u044E\u0442\u0435: \u0434\u043E\u043B\u043B\u0430\u0440 \u043F\u0435\u0440\u0435\
  \u0441\u0447\u0438\u0442\u0430\u043D \u043F\u043E \u043A\u0443\u0440\u0441\u0443\
  \n    -- \u0441\u0442\u0440\u043E\u043A\u0438, \u0438 \u043E\u0442\u043D\u043E\u0448\
  \u0435\u043D\u0438\u0435 \u0441\u0443\u043C\u043C \u0432 USD \u0440\u0430\u0441\u0445\
  \u043E\u0434\u0438\u0442\u0441\u044F \u0441 BYN \u043D\u0430 \u0434\u0435\u0441\u044F\
  \u0442\u044B\u0435 \u0434\u043E\u043B\u0438.\n    c.volume_pcs * c.wholesale_price_byn\
  \                                 AS rev_byn,\n    {% if basis == '\u0424\u0430\u043A\
  \u0442' %}\n    c.volume_pcs * coalesce(CASE WHEN {{ fact_ok }} THEN c.cost_fact_byn\
  \ END, c.cost_byn) AS cost_byn,\n    {% else %}\n    c.volume_pcs * c.cost_byn \
  \                                           AS cost_byn,\n    {% endif %}\n    --\
  \ \u041D\u043E\u0440\u043C\u0430\u0442\u0438\u0432 \u043F\u0440\u043E\u0442\u0438\
  \u0432 \u0444\u0430\u043A\u0442\u0430 \u043D\u0430 \u043E\u0434\u043D\u0438\u0445\
  \ \u0441\u0442\u0440\u043E\u043A\u0430\u0445 \u2014 \u0441 \u0433\u043E\u0434\u043D\
  \u044B\u043C \u0444\u0430\u043A\u0442\u043E\u043C.\n    CASE WHEN {{ fact_ok }}\
  \ THEN c.volume_pcs END                                    AS vol_f,\n    CASE WHEN\
  \ {{ fact_ok }} THEN c.volume_pcs * c.wholesale_price_{{ sfx }} END       AS rev_f,\n\
  \    CASE WHEN {{ fact_ok }} THEN c.volume_pcs * c.wholesale_price_byn END     \
  \       AS rev_f_byn,\n    CASE WHEN {{ fact_ok }} THEN c.volume_pcs * c.cost_fact_{{\
  \ sfx }} END             AS cost_f,\n    CASE WHEN {{ fact_ok }} THEN c.volume_pcs\
  \ * c.cost_fact_byn END                  AS cost_f_byn,\n    CASE WHEN {{ fact_ok\
  \ }} THEN c.volume_pcs * c.cost_{{ sfx }} END                  AS cost_n,\n    CASE\
  \ WHEN {{ fact_ok }} THEN c.volume_pcs * c.cost_byn END                       AS\
  \ cost_n_byn,\n    c.volume_pcs * c.sewing_minutes                             \
  \         AS sew_min,\n    CASE WHEN c.sewing_minutes IS NOT NULL THEN c.volume_pcs\
  \ END         AS sew_vol,\n    -- \u041D\u043E\u0440\u043C\u0430 \u043C\u0430\u0440\
  \u0436\u0438\u043D\u0430\u043B\u044C\u043D\u043E\u0441\u0442\u0438 \u043F\u043E\
  \ Level 01; 0 \u0432 \u0442\u0430\u0431\u043B\u0438\u0446\u0435 = \u043D\u0435 \u0437\
  \u0430\u0434\u0430\u043D\u0430.\n    t.target_margin_pct / 100.0               \
  \                           AS target_frac,\n    -- \u041F\u043B\u0430\u043D\u043E\
  \u0432\u0430\u044F \u0441\u0435\u0431\u0435\u0441\u0442\u043E\u0438\u043C\u043E\u0441\
  \u0442\u044C \u0435\u0434\u0438\u043D\u0438\u0446\u044B \u0438\u0437 \u0441\u043F\
  \u0440\u0430\u0432\u043E\u0447\u043D\u0438\u043A\u0430 \u043C\u043E\u0434\u0435\u043B\
  \u0435\u0439 \u041B\u0438\u0441\u044B (\u043C\u0438\u0433\u0440\u0430\u0446\u0438\
  \u044F 0043).\n    -- \u041E\u0431\u044A\u0451\u043C \u043E\u0442\u0434\u0435\u043B\
  \u044C\u043D\u043E\u0439 \u043A\u043E\u043B\u043E\u043D\u043A\u043E\u0439: \u0434\
  \u0435\u043B\u0438\u0442\u044C \u043F\u043B\u0430\u043D\u043E\u0432\u0443\u044E\
  \ \u0441\u0443\u043C\u043C\u0443 \u043D\u0430 \u0432\u0435\u0441\u044C \u0442\u0438\
  \u0440\u0430\u0436 \u0430\u0440\u0442\u0438\u043A\u0443\u043B\u0430\n    -- \u043D\
  \u0435\u043B\u044C\u0437\u044F, \u0435\u0441\u043B\u0438 \u043F\u043B\u0430\u043D\
  \ \u0437\u0430\u0432\u0435\u0434\u0451\u043D \u043D\u0435 \u043D\u0430 \u0432\u0441\
  \u0435 \u0435\u0433\u043E \u0441\u0442\u0440\u043E\u043A\u0438.\n    CASE WHEN pp.plan_price\
  \ IS NOT NULL THEN c.volume_pcs END               AS vol_p,\n    c.volume_pcs *\
  \ pp.plan_price                                            AS cost_p,\n    c.volume_pcs\
  \ * c.cost_byn                                               AS cost_norm_all,\n\
  \    -- \u0420\u0430\u043D\u043D\u0438\u0435 \u044D\u0442\u0430\u043F\u044B \u0442\
  \u043E\u0433\u043E \u0436\u0435 \u0437\u0430\u0434\u0430\u043D\u0438\u044F. \u041A\
  \u043B\u044E\u0447 \u2014 \u043C\u043E\u0434\u0435\u043B\u044C + \u0430\u0440\u0442\
  \u0438\u043A\u0443\u043B + \u043F\u043B\u0430\u043D + \u0437\u0430\u0434\u0430\u043D\
  \u0438\u0435,\n    -- \u043A\u0430\u043A \u0443 get_prev_stage_prices \u0432 app/db.py.\
  \ LATERAL \u0441 ORDER BY calc_date:\n    -- \u043D\u0430 \u044D\u0442\u0430\u043F\
  \ \u0431\u044B\u0432\u0430\u0435\u0442 \u043D\u0435\u0441\u043A\u043E\u043B\u044C\
  \u043A\u043E \u0440\u0430\u0441\u0447\u0451\u0442\u043E\u0432, \u0434\u0435\u0439\
  \u0441\u0442\u0432\u0443\u044E\u0449\u0438\u0439 \u2014 \u043F\u043E\u0441\u043B\
  \u0435\u0434\u043D\u0438\u0439.\n    CASE WHEN kp.cost_byn IS NOT NULL THEN c.volume_pcs\
  \ END                 AS vol_k,\n    c.volume_pcs * kp.cost_{{ sfx }}          \
  \                                AS cost_k,\n    CASE WHEN pf.cost_byn IS NOT NULL\
  \ THEN c.volume_pcs END                 AS vol_pf,\n    c.volume_pcs * pf.cost_{{\
  \ sfx }}                                          AS cost_pf\n  FROM cost_calc_mv\
  \ c\n  LEFT JOIN LATERAL (\n    SELECT s.cost_byn, s.cost_usd FROM cost_calc_mv\
  \ s\n    WHERE s.calc_sign = '\u041A\u041F\u0421\u0421' AND s.model = c.model AND\
  \ s.articul = c.articul\n      AND coalesce(s.plan_id, '') = coalesce(c.plan_id,\
  \ '')\n      AND coalesce(s.zadanie, '') = coalesce(c.zadanie, '') AND s.cost_byn\
  \ > 0\n    ORDER BY s.calc_date DESC LIMIT 1) kp ON TRUE\n  LEFT JOIN LATERAL (\n\
  \    SELECT s.cost_byn, s.cost_usd FROM cost_calc_mv s\n    WHERE s.calc_sign =\
  \ '\u041F\u0424\u041A\u0421\u0421' AND s.model = c.model AND s.articul = c.articul\n\
  \      AND coalesce(s.plan_id, '') = coalesce(c.plan_id, '')\n      AND coalesce(s.zadanie,\
  \ '') = coalesce(c.zadanie, '') AND s.cost_byn > 0\n    ORDER BY s.calc_date DESC\
  \ LIMIT 1) pf ON TRUE\n  LEFT JOIN cost_margin_targets t ON t.level1 = c.level01\
  \ AND t.target_margin_pct > 0\n  LEFT JOIN cost_plan_prices pp ON pp.model = c.model\
  \ AND pp.articul = c.articul\n  -- \u0411\u0430\u0437\u0430 \u2014 \u043A\u0430\u043A\
  \ \u0443 mf_cost_commercial, \u043F\u043B\u044E\u0441 \u0432\u044B\u043F\u0443\u0441\
  \u043A: \u0442\u043E\u043B\u044C\u043A\u043E \u0424\u041A\u0421\u0421 \u0438 \u0442\
  \u043E\u043B\u044C\u043A\u043E \u0441\u0442\u0440\u043E\u043A\u0438 \u0441 \u043E\
  \u0431\u044A\u0451\u043C\u043E\u043C.\n  WHERE c.cost_byn > 0 AND c.cost_byn < 1000\
  \ AND c.wholesale_price_byn > 0\n    AND c.level01 IS DISTINCT FROM '\u041F\u043E\
  \u043B\u0443\u0444\u0430\u0431\u0440\u0438\u043A\u0430\u0442\u044B'\n    AND c.calc_sign\
  \ = '\u0424\u041A\u0421\u0421' AND c.volume_pcs > 0 AND c.production_date IS NOT\
  \ NULL\n    -- MRV: \u043C\u0443\u043B\u044C\u0442\u0438\u043F\u0430\u043A\u0438\
  \ \u2014 \u0432\u043D\u0435 \u0430\u043D\u0430\u043B\u0438\u0437\u0430, \u043A\u0430\
  \u043A BASE_CONDITIONS \u0444\u0440\u043E\u043D\u0442\u0430 (app/commercial.py)\
  \ \u0438 in_calc \u0432\u0438\u0442\u0440\u0438\u043D\u044B\n    -- \u0448\u0430\
  \u043F\u043A\u0438 mf_cost_margin_head: \u0441\u0435\u0431\u0435\u0441\u0442\u043E\
  \u0438\u043C\u043E\u0441\u0442\u044C \u043F\u0430\u043A\u0430 \u0441\u043E\u0431\
  \u0440\u0430\u043D\u0430 \u0438\u0437 \u043E\u0434\u0438\u043D\u043E\u0447\u0435\
  \u043A, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0432 \u0431\u0430\u0437\u0435\
  \ \u0443\u0436\u0435 \u0435\u0441\u0442\u044C.\n    AND coalesce((c.model, c.articul)\
  \ NOT IN (SELECT model, articul FROM cost_multipack), TRUE)\n),\n-- MP4: \u0440\u0430\
  \u043D\u0433 Level 01 \u0434\u043B\u044F \u0448\u0430\u0433\u043E\u0432 \u0432\u043E\
  \u0434\u043E\u043F\u0430\u0434\u043E\u0432 (\u0441\u043C. level01_wf \u0432\u044B\
  \u0448\u0435).\nrk AS (\n  SELECT coalesce(level01, '') AS lv,\n         row_number()\
  \ OVER (ORDER BY sum(rev_byn - cost_byn) DESC NULLS LAST, coalesce(level01, ''))\
  \ AS r\n  FROM src\n  WHERE TRUE{{ flt('prod_year', \"to_char(m, 'YYYY')\") }}{{\
  \ flt('prod_month_label', \"(ARRAY['\u044F\u043D\u0432\u0430\u0440\u044C','\u0444\
  \u0435\u0432\u0440\u0430\u043B\u044C','\u043C\u0430\u0440\u0442','\u0430\u043F\u0440\
  \u0435\u043B\u044C','\u043C\u0430\u0439','\u0438\u044E\u043D\u044C','\u0438\u044E\
  \u043B\u044C','\u0430\u0432\u0433\u0443\u0441\u0442','\u0441\u0435\u043D\u0442\u044F\
  \u0431\u0440\u044C','\u043E\u043A\u0442\u044F\u0431\u0440\u044C','\u043D\u043E\u044F\
  \u0431\u0440\u044C','\u0434\u0435\u043A\u0430\u0431\u0440\u044C'])[extract(month\
  \ FROM m)::int]\") }}{{ flt('prod_month_axis', month_axis('m')) }}{{ flt('plan_id',\
  \ 'plan_id') }}{{ flt('brand_manager', 'brand_manager') }}{{ flt('level01', 'level01')\
  \ }}{{ flt('level02', 'level02') }}{{ flt('level03', 'level03') }}{{ flt('level04',\
  \ 'level04') }}{{ flt('level05', 'level05') }}{{ flt('model_name', 'model_name')\
  \ }}{{ flt('model', 'model') }}{{ flt('articul', 'articul') }}{{ flt('zadanie',\
  \ 'zadanie') }}{{ flt('country', 'country') }}{{ flt('season', 'season') }}\n  GROUP\
  \ BY 1\n),\n-- MP5: \u0440\u0430\u043D\u0433 \u0441\u0442\u0440\u043E\u043A\u0438\
  \ \u043C\u0430\u0442\u0440\u0438\u0446\u044B (matrix_row) \u043F\u043E \u043C\u0430\
  \u0440\u0436\u0435 \u0442\u0435\u043A\u0443\u0449\u0435\u0433\u043E \u043F\u0435\
  \u0440\u0438\u043E\u0434\u0430 \u0432 BYN, \u043F\u0443\u0441\u0442\u044B\u0435\
  \ \u0432\u043D\u0438\u0437\u0443 \u2014 \u043F\u043E\u0440\u044F\u0434\u043E\u043A\
  \n-- \u0441\u0442\u0440\u043E\u043A \u043C\u0430\u0442\u0440\u0438\u0446\u044B \u0444\
  \u0440\u043E\u043D\u0442\u0430 (ORDER BY \u2026 DESC NULLS LAST). \u041D\u0443\u0436\
  \u0435\u043D \u0432\u043E\u0434\u043E\u043F\u0430\u0434\u0430\u043C (matrix_row_wf)\
  \ \u0438 \u043E\u0442\u0441\u0435\u0447\u043A\u0435\n-- 300 \u0441\u0442\u0440\u043E\
  \u043A (matrix_rank). \u0421\u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044F \u043F\
  \u043E \u043E\u0442\u0444\u0438\u043B\u044C\u0442\u0440\u043E\u0432\u0430\u043D\u043D\
  \u044B\u043C \u0441\u0442\u0440\u043E\u043A\u0430\u043C \u0442\u0435\u043A\u0443\
