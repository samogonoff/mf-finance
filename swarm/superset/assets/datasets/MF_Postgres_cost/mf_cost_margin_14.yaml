table_name: mf_cost_margin
main_dttm_col: prod_month
currency_code_column: null
description: "\u041C\u0430\u0440\u0436\u0430 \u0432\u044B\u043F\u0443\u0441\u043A\u0430\
  : \u0441\u0442\u0440\u043E\u043A\u0438 \u0432\u044B\u043F\u0443\u0441\u043A\u0430\
  \ \u0424\u041A\u0421\u0421 \u0441 \u043E\u0431\u044A\u0451\u043C\u043E\u043C, \u0442\
  \u0440\u0438 \u043A\u043E\u043F\u0438\u0438 \u0441\u043E \u0441\u0434\u0432\u0438\
  \u0433\u043E\u043C \u043C\u0435\u0442\u043A\u0438 \u043C\u0435\u0441\u044F\u0446\
  \u0430 (k = cur / pm / py) \u0434\u043B\u044F \u0441\u0440\u0430\u0432\u043D\u0435\
  \u043D\u0438\u044F \u0441 \u043F\u0440\u043E\u0448\u043B\u044B\u043C \u043C\u0435\
  \u0441\u044F\u0446\u0435\u043C \u0438 \u0433\u043E\u0434\u043E\u043C; \u0432\u0430\
  \u043B\u044E\u0442\u0430 \u2014 \u043F\u043E \u0444\u0438\u043B\u044C\u0442\u0440\
  \u0443."
default_endpoint: null
offset: 0
cache_timeout: 3600
catalog: cost
schema: public
sql: "-- \u0412\u0438\u0442\u0440\u0438\u043D\u0430 \xAB\u041C\u0430\u0440\u0436\u0430\
  \ \u0432\u044B\u043F\u0443\u0441\u043A\u0430\xBB: \u043F\u0435\u0440\u0435\u043D\
  \u043E\u0441 \u043E\u0442\u0447\u0451\u0442\u043E\u0432 Power BI \u0437\u0430\u043A\
  \u0430\u0437\u0447\u0438\u043A\u0430 \u043D\u0430 \u0434\u0430\u043D\u043D\u044B\
  \u0435 \u043F\u0440\u043E\u0435\u043A\u0442\u0430.\n-- \u0424\u043E\u0440\u043C\u0443\
  \u043B\u044B \u0438 \u0433\u0440\u0430\u043D\u0438\u0446\u044B \u2014 docs/bi/metrics.md,\
  \ docs/bi/pbi-margin-port.md.\n--\n-- \u0412\u0410\u041B\u042E\u0422\u0410 \u041F\
  \u0415\u0420\u0415\u041A\u041B\u042E\u0427\u0410\u0415\u0422\u0421\u042F \u0424\u0418\
  \u041B\u042C\u0422\u0420\u041E\u041C \xAB\u0412\u0430\u043B\u044E\u0442\u0430\xBB\
  \ (\u0434\u0430\u0442\u0430\u0441\u0435\u0442 mf_currency_pick): \u0437\u043D\u0430\
  \u0447\u0435\u043D\u0438\u0435\n-- \u043F\u0440\u0438\u0445\u043E\u0434\u0438\u0442\
  \ \u0447\u0435\u0440\u0435\u0437 filter_values() \u0438 \u0432\u044B\u0431\u0438\
  \u0440\u0430\u0435\u0442 \u043A\u043E\u043B\u043E\u043D\u043A\u0438 *_byn \u0438\
  \u043B\u0438 *_usd. \u0417\u043D\u0430\u0447\u0435\u043D\u0438\u0435\n-- \u0441\u0432\
  \u0435\u0440\u044F\u0435\u0442\u0441\u044F \u0441 \u0431\u0435\u043B\u044B\u043C\
  \ \u0441\u043F\u0438\u0441\u043A\u043E\u043C \u2014 filter_values() \u043E\u0442\
  \u0434\u0430\u0451\u0442 \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\
  \u043B\u044C\u0441\u043A\u0443\u044E \u0441\u0442\u0440\u043E\u043A\u0443,\n-- \u0431\
  \u0435\u0437 \u0441\u0432\u0435\u0440\u043A\u0438 \u044D\u0442\u043E \u0438\u043D\
  \u044A\u0435\u043A\u0446\u0438\u044F.\n{% set raw = filter_values('currency_pick')\
  \ %}\n{% set cur = raw[0] if raw and raw[0] in ['BYN', 'USD'] else 'BYN' %}\n{%\
  \ set sfx = 'usd' if cur == 'USD' else 'byn' %}\n-- \u0411\u0410\u0417\u0410 \u0421\
  \u0415\u0411\u0415\u0421\u0422\u041E\u0418\u041C\u041E\u0421\u0422\u0418 \u2014\
  \ \u0444\u0438\u043B\u044C\u0442\u0440 \xAB\u0421\u0435\u0431\u0435\u0441\u0442\u043E\
  \u0438\u043C\u043E\u0441\u0442\u044C\xBB (\u0434\u0430\u0442\u0430\u0441\u0435\u0442\
  \ mf_basis_pick): \u0444\u0430\u043A\u0442, \u0433\u0434\u0435 \u043E\u043D\n--\
  \ \u0433\u043E\u0434\u0435\u043D, \u0438\u043D\u0430\u0447\u0435 \u043D\u043E\u0440\
  \u043C\u0430\u0442\u0438\u0432; \u043B\u0438\u0431\u043E \u0432\u0441\u0435\u0433\
  \u0434\u0430 \u043D\u043E\u0440\u043C\u0430\u0442\u0438\u0432.\n{% set rawb = filter_values('basis_pick')\
  \ %}\n{% set basis = rawb[0] if rawb and rawb[0] in ['\u0424\u0430\u043A\u0442',\
  \ '\u041D\u043E\u0440\u043C\u0430\u0442\u0438\u0432'] else '\u0424\u0430\u043A\u0442\
  ' %}\n-- \u0413\u041E\u0414\u041D\u041E\u0421\u0422\u042C \u0424\u0410\u041A\u0422\
  \u0410. \u0413\u0434\u0435 \u0444\u0430\u043A\u0442\u0438\u0447\u0435\u0441\u043A\
  \u0430\u044F \u0441\u0442\u0430\u0432\u043A\u0430 \u043C\u0438\u043D\u0443\u0442\
  \u044B \u0432 \u041B\u0438\u0441\u0435 \u043D\u0435 \u0437\u0430\u0432\u0435\u0434\
  \u0435\u043D\u0430, \u0438\u0441\u0442\u043E\u0447\u043D\u0438\u043A\n-- \u0443\u043C\
  \u043D\u043E\u0436\u0430\u0435\u0442 \u043C\u0438\u043D\u0443\u0442\u044B \u043D\
  \u0430 \u043D\u043E\u043B\u044C \u0438 \xAB\u0421\u0435\u0431\u0435\u0441\u0442\u043E\
  \u0438\u043C\u043E\u0441\u0442\u044C \u0444\u0430\u043A\u0442\xBB = \u043D\u043E\
  \u0440\u043C\u0430\u0442\u0438\u0432 \u043C\u0438\u043D\u0443\u0441 \u043F\u043E\
  \u0448\u0438\u0432 (\u0443 \u0444\u0438\u0440\u043C\u044B\n-- 166 \u043A\u043E\u043D\
  \u0441\u0442\u0430\u043D\u0442 *_MIN_F \u043D\u0435\u0442, \u0443 152 \u0438 455\
  \ \u2014 \u0442\u043E\u043B\u044C\u043A\u043E \u0441 \u043C\u0430\u044F 2026). \u0424\
  \u0430\u043A\u0442 \u0433\u043E\u0434\u0435\u043D, \u0442\u043E\u043B\u044C\u043A\
  \u043E\n-- \u0435\u0441\u043B\u0438 \u0443 \u043A\u0430\u0436\u0434\u043E\u0439\
  \ \u043E\u043F\u0435\u0440\u0430\u0446\u0438\u0438 \u0441 \u043D\u043E\u0440\u043C\
  \u0430\u0442\u0438\u0432\u043E\u043C > 0 \u0444\u0430\u043A\u0442 \u0442\u043E\u0436\
  \u0435 > 0. \u0421\u043C. docs/bi/metrics.md.\n{% set fact_ok = \"(c.cost_fact_byn\
  \ IS NOT NULL AND NOT (coalesce(c.sewing_byn, 0) > 0 AND coalesce(c.sewing_fact_byn,\
  \ 0) = 0) AND NOT (coalesce(c.cutting_byn, 0) > 0 AND coalesce(c.cutting_fact_byn,\
  \ 0) = 0))\" %}\nWITH src AS (\n  SELECT\n    date_trunc('month', c.production_date)::date\
  \ AS m,\n    c.brand_manager, c.level01, c.level02, c.level03, c.level04, c.level05,\
  \ c.model_name, c.model, c.articul, c.country, c.season, c.zadanie, c.plan_id,\n\
  \    c.volume_pcs                                                         AS vol,\n\
  \    c.volume_pcs * c.wholesale_price_{{ sfx }}                               AS\
  \ rev,\n    {% if basis == '\u0424\u0430\u043A\u0442' %}\n    c.volume_pcs * coalesce(CASE\
  \ WHEN {{ fact_ok }} THEN c.cost_fact_{{ sfx }} END, c.cost_{{ sfx }}) AS cost,\n\
  \    {% else %}\n    c.volume_pcs * c.cost_{{ sfx }}                           \
  \               AS cost,\n    {% endif %}\n    c.volume_pcs * (coalesce(c.mat_main_{{\
  \ sfx }}, 0) + coalesce(c.mat_aux_{{ sfx }}, 0)) AS raw,\n    -- \u041F\u0440\u043E\
  \u0446\u0435\u043D\u0442\u044B \u0441\u0447\u0438\u0442\u0430\u044E\u0442\u0441\u044F\
  \ \u0432 BYN \u043F\u0440\u0438 \u043B\u044E\u0431\u043E\u0439 \u0432\u0430\u043B\
  \u044E\u0442\u0435: \u0434\u043E\u043B\u043B\u0430\u0440 \u043F\u0435\u0440\u0435\
  \u0441\u0447\u0438\u0442\u0430\u043D \u043F\u043E \u043A\u0443\u0440\u0441\u0443\
  \n    -- \u0441\u0442\u0440\u043E\u043A\u0438, \u0438 \u043E\u0442\u043D\u043E\u0448\
  \u0435\u043D\u0438\u0435 \u0441\u0443\u043C\u043C \u0432 USD \u0440\u0430\u0441\u0445\
  \u043E\u0434\u0438\u0442\u0441\u044F \u0441 BYN \u043D\u0430 \u0434\u0435\u0441\u044F\
  \u0442\u044B\u0435 \u0434\u043E\u043B\u0438.\n    c.volume_pcs * c.wholesale_price_byn\
  \                                 AS rev_byn,\n    {% if basis == '\u0424\u0430\u043A\
  \u0442' %}\n    c.volume_pcs * coalesce(CASE WHEN {{ fact_ok }} THEN c.cost_fact_byn\
  \ END, c.cost_byn) AS cost_byn,\n    {% else %}\n    c.volume_pcs * c.cost_byn \
  \                                           AS cost_byn,\n    {% endif %}\n    --\
  \ \u041D\u043E\u0440\u043C\u0430\u0442\u0438\u0432 \u043F\u0440\u043E\u0442\u0438\
  \u0432 \u0444\u0430\u043A\u0442\u0430 \u043D\u0430 \u043E\u0434\u043D\u0438\u0445\
  \ \u0441\u0442\u0440\u043E\u043A\u0430\u0445 \u2014 \u0441 \u0433\u043E\u0434\u043D\
  \u044B\u043C \u0444\u0430\u043A\u0442\u043E\u043C.\n    CASE WHEN {{ fact_ok }}\
  \ THEN c.volume_pcs END                                    AS vol_f,\n    CASE WHEN\
  \ {{ fact_ok }} THEN c.volume_pcs * c.wholesale_price_{{ sfx }} END       AS rev_f,\n\
  \    CASE WHEN {{ fact_ok }} THEN c.volume_pcs * c.wholesale_price_byn END     \
  \       AS rev_f_byn,\n    CASE WHEN {{ fact_ok }} THEN c.volume_pcs * c.cost_fact_{{\
  \ sfx }} END             AS cost_f,\n    CASE WHEN {{ fact_ok }} THEN c.volume_pcs\
  \ * c.cost_fact_byn END                  AS cost_f_byn,\n    CASE WHEN {{ fact_ok\
  \ }} THEN c.volume_pcs * c.cost_{{ sfx }} END                  AS cost_n,\n    CASE\
  \ WHEN {{ fact_ok }} THEN c.volume_pcs * c.cost_byn END                       AS\
  \ cost_n_byn,\n    c.volume_pcs * c.sewing_minutes                             \
  \         AS sew_min,\n    CASE WHEN c.sewing_minutes IS NOT NULL THEN c.volume_pcs\
  \ END         AS sew_vol,\n    -- \u041D\u043E\u0440\u043C\u0430 \u043C\u0430\u0440\
  \u0436\u0438\u043D\u0430\u043B\u044C\u043D\u043E\u0441\u0442\u0438 \u043F\u043E\
  \ Level 01; 0 \u0432 \u0442\u0430\u0431\u043B\u0438\u0446\u0435 = \u043D\u0435 \u0437\
  \u0430\u0434\u0430\u043D\u0430.\n    t.target_margin_pct / 100.0               \
  \                           AS target_frac,\n    -- \u041F\u043B\u0430\u043D\u043E\
  \u0432\u0430\u044F \u0441\u0435\u0431\u0435\u0441\u0442\u043E\u0438\u043C\u043E\u0441\
  \u0442\u044C \u0435\u0434\u0438\u043D\u0438\u0446\u044B \u0438\u0437 \u0441\u043F\
  \u0440\u0430\u0432\u043E\u0447\u043D\u0438\u043A\u0430 \u043C\u043E\u0434\u0435\u043B\
  \u0435\u0439 \u041B\u0438\u0441\u044B (\u043C\u0438\u0433\u0440\u0430\u0446\u0438\
  \u044F 0043).\n    -- \u041E\u0431\u044A\u0451\u043C \u043E\u0442\u0434\u0435\u043B\
  \u044C\u043D\u043E\u0439 \u043A\u043E\u043B\u043E\u043D\u043A\u043E\u0439: \u0434\
  \u0435\u043B\u0438\u0442\u044C \u043F\u043B\u0430\u043D\u043E\u0432\u0443\u044E\
  \ \u0441\u0443\u043C\u043C\u0443 \u043D\u0430 \u0432\u0435\u0441\u044C \u0442\u0438\
  \u0440\u0430\u0436 \u0430\u0440\u0442\u0438\u043A\u0443\u043B\u0430\n    -- \u043D\
  \u0435\u043B\u044C\u0437\u044F, \u0435\u0441\u043B\u0438 \u043F\u043B\u0430\u043D\
  \ \u0437\u0430\u0432\u0435\u0434\u0451\u043D \u043D\u0435 \u043D\u0430 \u0432\u0441\
  \u0435 \u0435\u0433\u043E \u0441\u0442\u0440\u043E\u043A\u0438.\n    CASE WHEN pp.plan_price\
  \ IS NOT NULL THEN c.volume_pcs END               AS vol_p,\n    c.volume_pcs *\
  \ pp.plan_price                                            AS cost_p,\n    c.volume_pcs\
  \ * c.cost_byn                                               AS cost_norm_all\n\
  \  FROM cost_calc_mv c\n  LEFT JOIN cost_margin_targets t ON t.level1 = c.level01\
  \ AND t.target_margin_pct > 0\n  LEFT JOIN cost_plan_prices pp ON pp.model = c.model\
  \ AND pp.articul = c.articul\n  -- \u0411\u0430\u0437\u0430 \u2014 \u043A\u0430\u043A\
  \ \u0443 mf_cost_commercial, \u043F\u043B\u044E\u0441 \u0432\u044B\u043F\u0443\u0441\
  \u043A: \u0442\u043E\u043B\u044C\u043A\u043E \u0424\u041A\u0421\u0421 \u0438 \u0442\
  \u043E\u043B\u044C\u043A\u043E \u0441\u0442\u0440\u043E\u043A\u0438 \u0441 \u043E\
  \u0431\u044A\u0451\u043C\u043E\u043C.\n  WHERE c.cost_byn > 0 AND c.cost_byn < 1000\
  \ AND c.wholesale_price_byn > 0\n    AND c.level01 IS DISTINCT FROM '\u041F\u043E\
  \u043B\u0443\u0444\u0430\u0431\u0440\u0438\u043A\u0430\u0442\u044B'\n    AND c.calc_sign\
  \ = '\u0424\u041A\u0421\u0421' AND c.volume_pcs > 0 AND c.production_date IS NOT\
  \ NULL\n)\n-- \u0421\u0414\u0412\u0418\u041D\u0423\u0422\u041E\u0415 \u041E\u0411\
  \u042A\u0415\u0414\u0418\u041D\u0415\u041D\u0418\u0415: \u0442\u0440\u0438 \u043A\
  \u043E\u043F\u0438\u0438 \u043A\u0430\u0436\u0434\u043E\u0439 \u0441\u0442\u0440\
  \u043E\u043A\u0438 \u2014 \u0442\u0435\u043A\u0443\u0449\u0430\u044F (k = cur),\
  \ \u0441 \u043C\u0435\u0442\u043A\u043E\u0439\n-- \u043C\u0435\u0441\u044F\u0446\
  \u0430 \u043D\u0430 \u043C\u0435\u0441\u044F\u0446 \u0432\u043F\u0435\u0440\u0451\
  \u0434 (pm) \u0438 \u043D\u0430 \u0433\u043E\u0434 \u0432\u043F\u0435\u0440\u0451\
  \u0434 (py). \u0424\u0438\u043B\u044C\u0442\u0440 \u0434\u0430\u0448\u0431\u043E\
  \u0440\u0434\u0430 \u043F\u043E \u0433\u043E\u0434\u0443 \u0438\n-- \u043C\u0435\
  \u0441\u044F\u0446\u0443 \u043B\u043E\u0436\u0438\u0442\u0441\u044F \u043D\u0430\
  \ \u043C\u0435\u0442\u043A\u0443, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 sum(x)\
  \ FILTER (WHERE k = 'py') \u2014 \u044D\u0442\u043E \u0437\u043D\u0430\u0447\u0435\
  \u043D\u0438\u0435\n-- \u043F\u0440\u043E\u0448\u043B\u043E\u0433\u043E \u0433\u043E\
  \u0434\u0430 \u0440\u043E\u0432\u043D\u043E \u0434\u043B\u044F \u0432\u044B\u0431\
  \u0440\u0430\u043D\u043D\u043E\u0433\u043E \u043F\u0435\u0440\u0438\u043E\u0434\u0430\
  , \u043D\u0430 \u043B\u044E\u0431\u043E\u043C \u0440\u0430\u0437\u0440\u0435\u0437\
  \u0435 (DATEADD Power BI).\nSELECT\n  '{{ cur }}'::text AS currency_pick,   -- dummy-\u043A\
  \u043E\u043B\u043E\u043D\u043A\u0430: \u0444\u0438\u043B\u044C\u0442\u0440 \xAB\u0412\
  \u0430\u043B\u044E\u0442\u0430\xBB \u043F\u043E\u0434\u0441\u0442\u0430\u0432\u043B\
  \u044F\u0435\u0442 WHERE currency_pick IN (...)\n  '{{ basis }}'::text AS basis_pick,\
  \    -- dummy-\u043A\u043E\u043B\u043E\u043D\u043A\u0430 \u0444\u0438\u043B\u044C\
  \u0442\u0440\u0430 \xAB\u0421\u0435\u0431\u0435\u0441\u0442\u043E\u0438\u043C\u043E\
  \u0441\u0442\u044C\xBB\n  k,\n  m AS prod_month,\n  to_char(m, 'YYYY') AS prod_year,\n\
  \  to_char(m, 'MM') || ' \xB7 ' || (ARRAY['\u044F\u043D\u0432\u0430\u0440\u044C\
  ','\u0444\u0435\u0432\u0440\u0430\u043B\u044C','\u043C\u0430\u0440\u0442','\u0430\
  \u043F\u0440\u0435\u043B\u044C','\u043C\u0430\u0439','\u0438\u044E\u043D\u044C','\u0438\
  \u044E\u043B\u044C','\u0430\u0432\u0433\u0443\u0441\u0442','\u0441\u0435\u043D\u0442\
  \u044F\u0431\u0440\u044C','\u043E\u043A\u0442\u044F\u0431\u0440\u044C','\u043D\u043E\
  \u044F\u0431\u0440\u044C','\u0434\u0435\u043A\u0430\u0431\u0440\u044C'])[extract(month\
  \ FROM m)::int] AS prod_month_name,\n  brand_manager, level01, level02, level03,\
  \ level04, level05, model_name, model, articul, country, season, zadanie, plan_id,\n\
  \  vol, rev, cost, raw, rev_byn, cost_byn, sew_min, sew_vol, target_frac, vol_f,\
  \ rev_f, rev_f_byn, cost_f, cost_f_byn, cost_n, cost_n_byn, vol_p, cost_p, cost_norm_all\n\
  FROM (\n  SELECT 'cur' AS k, m,                              brand_manager, level01,\
  \ level02, level03, level04, level05, model_name, model, articul, country, season,\
  \ zadanie, plan_id, vol, rev, cost, raw, rev_byn, cost_byn, sew_min, sew_vol, target_frac,\
  \ vol_f, rev_f, rev_f_byn, cost_f, cost_f_byn, cost_n, cost_n_byn, vol_p, cost_p,\
  \ cost_norm_all FROM src\n  UNION ALL\n  SELECT 'pm',        (m + interval '1 month')::date,\
  \ brand_manager, level01, level02, level03, level04, level05, model_name, model,\
