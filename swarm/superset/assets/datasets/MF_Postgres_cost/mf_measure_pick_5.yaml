sql: "-- \u0421\u043F\u0440\u0430\u0432\u043E\u0447\u043D\u0438\u043A \u0437\u043D\
  \u0430\u0447\u0435\u043D\u0438\u0439 \u043F\u0435\u0440\u0435\u043A\u043B\u044E\u0447\
  \u0430\u0442\u0435\u043B\u044F \xAB\u041C\u0435\u0440\u0430\xBB \u043A\u043E\u043B\
  \u044C\u0446\u0430 \xAB\u0421\u0442\u0440\u0443\u043A\u0442\u0443\u0440\u0430 \u0432\
  \u044B\u043F\u0443\u0441\u043A\u0430\xBB (comm-09).\n-- \u041D\u0430\u0442\u0438\
  \u0432\u043D\u044B\u0439 \u0444\u0438\u043B\u044C\u0442\u0440 \u0431\u0435\u0440\
  \u0451\u0442 \u0432\u0430\u0440\u0438\u0430\u043D\u0442\u044B \u0442\u043E\u043B\
  \u044C\u043A\u043E \u0438\u0437 \u043A\u043E\u043B\u043E\u043D\u043A\u0438 \u0434\
  \u0430\u0442\u0430\u0441\u0435\u0442\u0430, \u043F\u043E\u044D\u0442\u043E\u043C\
  \u0443 \u0441\u043F\u0438\u0441\u043E\u043A \u0437\u0434\u0435\u0441\u044C.\n--\
  \ \u041F\u043E\u0434\u043F\u0438\u0441\u0438 \u2014 \u0434\u043E\u0441\u043B\u043E\
  \u0432\u043D\u043E \u043A\u0430\u043A \u0432 \u0441\u0435\u043B\u0435\u043A\u0442\
  \u0435 \u0444\u0440\u043E\u043D\u0442\u0430 (app/commercial.py, MEASURES): \u0442\
  \u0435 \u0436\u0435 \u0441\u0442\u0440\u043E\u043A\u0438\n-- \u0441\u0432\u0435\u0440\
  \u044F\u044E\u0442\u0441\u044F \u0441 \u0431\u0435\u043B\u044B\u043C \u0441\u043F\
  \u0438\u0441\u043A\u043E\u043C \u0432 mf_cost_commercial_switch. \u041F\u043E\u0440\
  \u044F\u0434\u043E\u043A \u0432 \u0444\u0438\u043B\u044C\u0442\u0440\u0435 \u0437\
  \u0430\u0434\u0430\u0451\u0442\n-- \u043C\u0435\u0442\u0440\u0438\u043A\u0430 sort_key\
  \ = min(sort_order) (controlValues.sortMetric \u043F\u0440\u0438\u043D\u0438\u043C\
  \u0430\u0435\u0442 \u043C\u0435\u0442\u0440\u0438\u043A\u0443).\nSELECT '\u0412\u044B\
  \u043F\u0443\u0441\u043A, \u0448\u0442' AS measure_pick, 0 AS sort_order\nUNION\
  \ ALL\nSELECT '\u0412\u044B\u043F\u0443\u0441\u043A \u0432 \u043E\u0442\u043F\u0443\
  \u0441\u043A\u043D\u044B\u0445 \u0446\u0435\u043D\u0430\u0445, BYN' AS measure_pick,\
  \ 1 AS sort_order\nUNION ALL\nSELECT '\u0412\u044B\u043F\u0443\u0441\u043A \u043F\
  \u043E \u0441\u0435\u0431\u0435\u0441\u0442\u043E\u0438\u043C\u043E\u0441\u0442\u0438\
  , BYN' AS measure_pick, 2 AS sort_order\n"
