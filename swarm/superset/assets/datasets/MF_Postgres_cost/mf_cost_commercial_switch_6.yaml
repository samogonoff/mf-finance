  \ || ' ' || to_char(production_date, 'YYYY') AS prod_ym_label,\n  -- \u0417\u043D\
  \u0430\u0447\u0435\u043D\u0438\u0435 \u043F\u0435\u0440\u0435\u043A\u043B\u044E\u0447\
  \u0430\u0442\u0435\u043B\u044F \u043A\u0430\u043A \u043A\u043E\u043B\u043E\u043D\
  \u043A\u0430: \u0444\u0438\u043B\u044C\u0442\u0440 \u043F\u043E\u0434\u0441\u0442\
  \u0430\u0432\u043B\u044F\u0435\u0442 \u0433\u0440\u0430\u0444\u0438\u043A\u0443\n\
  \  -- WHERE measure_pick IN (...), \u0438 \u0431\u0435\u0437 \u044D\u0442\u043E\u0439\
  \ \u043A\u043E\u043B\u043E\u043D\u043A\u0438 \u0437\u0430\u043F\u0440\u043E\u0441\
  \ \u0443\u043F\u0430\u043B \u0431\u044B.\n  {{ slevels[slev] }}::text AS struct_label,\n\
  \  '{{ slev }}'::text           AS struct_level,\n  '{{ pick }}'::text AS measure_pick,\n\
  \  CASE '{{ pick }}'\n    WHEN '\u0412\u044B\u043F\u0443\u0441\u043A \u0432 \u043E\
  \u0442\u043F\u0443\u0441\u043A\u043D\u044B\u0445 \u0446\u0435\u043D\u0430\u0445\
  , BYN' THEN volume_pcs * wholesale_price_byn\n    WHEN '\u0412\u044B\u043F\u0443\
  \u0441\u043A \u043F\u043E \u0441\u0435\u0431\u0435\u0441\u0442\u043E\u0438\u043C\
  \u043E\u0441\u0442\u0438, BYN'  THEN volume_pcs * cost_byn\n    ELSE volume_pcs\n\
  \  END AS measure_value\nFROM cost_calc_mv\n-- \u0412\u044B\u043F\u0443\u0441\u043A\
  \ \u0441\u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044F \u0442\u043E\u043B\u044C\
  \u043A\u043E \u043F\u043E \u0424\u041A\u0421\u0421 (\u0437\u0430\u043A\u0430\u0437\
  \u0447\u0438\u043A, 14.08.2026).\nWHERE cost_byn > 0 AND cost_byn < 1000 AND wholesale_price_byn\
  \ > 0\n  AND level01 IS DISTINCT FROM '\u041F\u043E\u043B\u0443\u0444\u0430\u0431\
  \u0440\u0438\u043A\u0430\u0442\u044B'\n  AND calc_sign = '\u0424\u041A\u0421\u0421\
  '\n  -- \u0411\u0435\u0437 \u0442\u0438\u0440\u0430\u0436\u0430 \u0441\u0442\u0440\
  \u043E\u043A\u0438 \u043D\u0435\u0442: \u043D\u0435\u0437\u0430\u043F\u043E\u043B\
  \u043D\u0435\u043D\u043D\u0430\u044F \u043C\u0435\u0440\u0430 \u0434\u0430\u0451\
  \u0442 \u043F\u0443\u0441\u0442\u043E\u0439 \u0433\u0440\u0430\u0444\u0438\u043A\
  \ (\xAB\u041D\u0435\u0442\n  -- \u0440\u0435\u0437\u0443\u043B\u044C\u0442\u0430\
  \u0442\u043E\u0432\xBB), \u0430 \u043D\u0435 \u043A\u043E\u043B\u044C\u0446\u043E\
  \ \u0438\u0437 \u043D\u0443\u043B\u0435\u0439. \u041D\u0430 \u0444\u0440\u043E\u043D\
  \u0442\u0435 \u0442\u043E \u0436\u0435: \xAB\u043C\u0435\u0440\u0430 \u043D\u0435\
  \ \u0437\u0430\u043F\u043E\u043B\u043D\u0435\u043D\u0430 \u2014\n  -- \u0433\u0440\
  \u0430\u0444\u0438\u043A \u043F\u0443\u0441\u0442, \u044D\u0442\u043E \u043D\u0435\
  \ \u043D\u043E\u043B\u044C\xBB. \u0426\u0435\u043D\u0430 \u0438 \u0441\u0435\u0431\
  \u0435\u0441\u0442\u043E\u0438\u043C\u043E\u0441\u0442\u044C \u0443\u0436\u0435\
  \ > 0 (\u0443\u0441\u043B\u043E\u0432\u0438\u044F \u0432\u044B\u0448\u0435),\n \
  \ -- \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u043F\u0443\u0441\u0442\u0430 \u043C\
  \u0435\u0440\u0430 \u0440\u043E\u0432\u043D\u043E \u0442\u043E\u0433\u0434\u0430\
  , \u043A\u043E\u0433\u0434\u0430 \u043F\u0443\u0441\u0442 volume_pcs.\n  AND volume_pcs\
  \ IS NOT NULL\n  -- \u041C\u0443\u043B\u044C\u0442\u0438\u043F\u0430\u043A\u0438\
  \ \u0432\u043D\u0435 \u0431\u0430\u0437\u044B \u2014 \u043A\u0430\u043A \u0432 mf_cost_commercial\
  \ \u0438 BASE_CONDITIONS \u0444\u0440\u043E\u043D\u0442\u0430.\n  AND coalesce((model,\
  \ articul) NOT IN (SELECT model, articul FROM cost_multipack), TRUE)\n\n{#- \u041F\
  \u0443\u0441\u0442\u043E\u0435 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0435\
  \ \u0418\u0417\u041C\u0415\u0420\u0415\u041D\u0418\u042F \u043A\u043E\u043B\u044C\
  \u0446\u0430 \u2014 \u043D\u0435 \u0441\u0435\u0433\u043C\u0435\u043D\u0442: \u0444\
  \u0440\u043E\u043D\u0442 \u0438\u0441\u043A\u043B\u044E\u0447\u0430\u0435\u0442\
  \ \u0435\u0433\u043E (app/commercial.py,\n   ring: WHERE \"{dimension}\" IS NOT\
  \ NULL). \u0418\u0437\u043C\u0435\u0440\u0435\u043D\u0438\u0435 \u043F\u0440\u0438\
  \u0445\u043E\u0434\u0438\u0442 \u0441\u044E\u0434\u0430 \u043A\u043E\u043B\u043E\
  \u043D\u043A\u043E\u0439 \u0437\u0430\u043F\u0440\u043E\u0441\u0430 (columns),\n\
  \   \u0435\u0433\u043E \u043F\u043E\u0434\u043C\u0435\u043D\u044F\u0435\u0442 chart\
  \ customization \xAB\u0418\u0437\u043C\u0435\u0440\u0435\u043D\u0438\u0435\xBB.\
  \ \u0421\u0432\u0435\u0440\u043A\u0430 \u0441 \u0431\u0435\u043B\u044B\u043C \u0441\
  \u043F\u0438\u0441\u043A\u043E\u043C DIMENSIONS \u0444\u0440\u043E\u043D\u0442\u0430\
  \ \u2014\n   \u0432 SQL \u043F\u043E\u043F\u0430\u0434\u0430\u0435\u0442 \u0442\u043E\
  \u043B\u044C\u043A\u043E \u0438\u043C\u044F \u043A\u043E\u043B\u043E\u043D\u043A\
  \u0438 \u0438\u0437 \u0441\u043B\u043E\u0432\u0430\u0440\u044F. \u0411\u0435\u0437\
  \ \u0443\u0441\u043B\u043E\u0432\u0438\u044F <NULL> \u0432\u044B\u0445\u043E\u0434\
  \u0438\u043B \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u044B\u043C \u0441\u0435\
  \u0433\u043C\u0435\u043D\u0442\u043E\u043C\n   (\u0441\u0435\u0437\u043E\u043D \u043F\
  \u0443\u0441\u0442 \u0443 2 \u043A\u0430\u043B\u044C\u043A\u0443\u043B\u044F\u0446\
  \u0438\u0439 349K-351 / 25349KZ, 9 980 \u0448\u0442) \u0438 \u0432\u044B\u0442\u0435\
  \u0441\u043D\u044F\u043B \u0431\u044B \u0440\u0435\u0430\u043B\u044C\u043D\u044B\
  \u0435 \u043F\u043E\u0437\u0438\u0446\u0438\u0438 \u0438\u0437\n   \u0442\u043E\u043F\
  -12. \u0423\u0441\u043B\u043E\u0432\u0438\u0435 \u0442\u043E\u043B\u044C\u043A\u043E\
  \ \u043D\u0430 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u0435 \u0438\u0437\
  \u043C\u0435\u0440\u0435\u043D\u0438\u0435, \u043A\u0430\u043A \u043D\u0430 \u0444\
  \u0440\u043E\u043D\u0442\u0435: \u0432 \u043E\u0441\u0442\u0430\u043B\u044C\u043D\
  \u044B\u0445 \u0440\u0430\u0437\u0440\u0435\u0437\u0430\u0445 \u044D\u0442\u0438\
  \n   \u043A\u0430\u043B\u044C\u043A\u0443\u043B\u044F\u0446\u0438\u0438 \u043E\u0441\
  \u0442\u0430\u044E\u0442\u0441\u044F. -#}\n{%- for c in (columns or []) if c is\
  \ string and c in ['model_name', 'model', 'country', 'season', 'level01', 'level02',\
  \ 'level03', 'brand_manager'] %}\n  AND {{ c }} IS NOT NULL\n{%- endfor %}\n"
