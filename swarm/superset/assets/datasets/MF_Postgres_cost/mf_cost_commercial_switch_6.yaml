sql: "-- \u0412\u0438\u0442\u0440\u0438\u043D\u0430 \xAB\u0441\u0442\u0440\u0443\u043A\
  \u0442\u0443\u0440\u044B \u0432\u044B\u043F\u0443\u0441\u043A\u0430\xBB \u0441 \u041F\
  \u0415\u0420\u0415\u041A\u041B\u042E\u0427\u0410\u0415\u041C\u041E\u0419 \u043C\u0435\
  \u0440\u043E\u0439.\n--\n-- \u041C\u0435\u0440\u0430 \u0432\u044B\u0431\u0438\u0440\
  \u0430\u0435\u0442\u0441\u044F \u043D\u0430\u0442\u0438\u0432\u043D\u044B\u043C\
  \ \u0444\u0438\u043B\u044C\u0442\u0440\u043E\u043C \xAB\u041C\u0435\u0440\u0430\xBB\
  \ \u043D\u0430 \u0434\u0430\u0448\u0431\u043E\u0440\u0434\u0435: \u0435\u0433\u043E\
  \ \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0435 \u043F\u0440\u0438\u0445\u043E\
  \u0434\u0438\u0442\n-- \u0441\u044E\u0434\u0430 \u0447\u0435\u0440\u0435\u0437 filter_values()\
  \ \u0438 \u043F\u043E\u0434\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u0442\u0441\
  \u044F \u0432 CASE. \u0418\u043D\u0430\u0447\u0435 \u043C\u0435\u0440\u0443 \u0443\
  \ \u0433\u0440\u0430\u0444\u0438\u043A\u0430\n-- Superset \u043F\u0440\u0438 \u043F\
  \u0440\u043E\u0441\u043C\u043E\u0442\u0440\u0435 \u043D\u0435 \u0441\u043C\u0435\
  \u043D\u0438\u0442\u044C \u2014 \u043E\u043D\u0430 \u0437\u0430\u0448\u0438\u0442\
  \u0430 \u0432 \u043A\u043E\u043D\u0444\u0438\u0433\u0443\u0440\u0430\u0446\u0438\
  \u044E \u0433\u0440\u0430\u0444\u0438\u043A\u0430.\n--\n-- \u0417\u043D\u0430\u0447\
  \u0435\u043D\u0438\u0435 \u0421\u0412\u0415\u0420\u042F\u0415\u0422\u0421\u042F\
  \ \u0421 \u0411\u0415\u041B\u042B\u041C \u0421\u041F\u0418\u0421\u041A\u041E\u041C\
  : filter_values() \u043E\u0442\u0434\u0430\u0451\u0442 \u043F\u043E\u043B\u044C\u0437\
  \u043E\u0432\u0430\u0442\u0435\u043B\u044C\u0441\u043A\u0443\u044E\n-- \u0441\u0442\
  \u0440\u043E\u043A\u0443, \u0430 Jinja \u0432\u0441\u0442\u0430\u0432\u043B\u044F\
  \u0435\u0442 \u0435\u0451 \u0432 SQL \u043A\u0430\u043A \u0435\u0441\u0442\u044C\
  . \u0411\u0435\u0437 \u0441\u0432\u0435\u0440\u043A\u0438 \u044D\u0442\u043E \u0438\
  \u043D\u044A\u0435\u043A\u0446\u0438\u044F.\n{% set raw = filter_values('measure_pick')\
  \ %}\n{% set pick = raw[0] if raw and raw[0] in ['\u0448\u0442', 'BYN (\u043E\u0442\
  \u043F\u0443\u0441\u043A\u043D\u044B\u0435)', 'BYN (\u0441\u0435\u0431\u0435\u0441\
  \u0442\u043E\u0438\u043C\u043E\u0441\u0442\u044C)'] else '\u0448\u0442' %}\nSELECT\n\
  \  model_name, model, articul, brand_manager, country, season, family,\n  level01,\
  \ level02, level03, level04, level05,\n  calc_sign,\n  to_char(production_date,\
  \ 'YYYY') AS prod_year,\n  -- \u0422\u0435 \u0436\u0435 \u0432\u044B\u0440\u0430\
  \u0436\u0435\u043D\u0438\u044F, \u0447\u0442\u043E \u0432 mf_cost_commercial: \u0444\
  \u0438\u043B\u044C\u0442\u0440\u044B \u0434\u0430\u0448\u0431\u043E\u0440\u0434\u0430\
  \ \u0431\u044C\u044E\u0442 \u043F\u043E \u0438\u043C\u0435\u043D\u0430\u043C\n \
  \ -- \u043A\u043E\u043B\u043E\u043D\u043E\u043A, \u0438 \u0431\u0435\u0437 \u043D\
  \u0438\u0445 \xAB\u041C\u0435\u0441\u044F\u0446 \u0432\u044B\u043F\u0443\u0441\u043A\
  \u0430\xBB \u043A \u044D\u0442\u043E\u043C\u0443 \u0433\u0440\u0430\u0444\u0438\u043A\
  \u0443 \u043F\u0440\u043E\u0441\u0442\u043E \u043D\u0435 \u043F\u0440\u0438\u043C\
  \u0435\u043D\u044F\u0435\u0442\u0441\u044F.\n  to_char(production_date, 'MM') ||\
  \ ' \xB7 ' || (ARRAY[\n      '\u044F\u043D\u0432\u0430\u0440\u044C','\u0444\u0435\
  \u0432\u0440\u0430\u043B\u044C','\u043C\u0430\u0440\u0442','\u0430\u043F\u0440\u0435\
  \u043B\u044C','\u043C\u0430\u0439','\u0438\u044E\u043D\u044C',\n      '\u0438\u044E\
  \u043B\u044C','\u0430\u0432\u0433\u0443\u0441\u0442','\u0441\u0435\u043D\u0442\u044F\
  \u0431\u0440\u044C','\u043E\u043A\u0442\u044F\u0431\u0440\u044C','\u043D\u043E\u044F\
  \u0431\u0440\u044C','\u0434\u0435\u043A\u0430\u0431\u0440\u044C'\n    ])[extract(month\
  \ from production_date)::int] AS prod_month_name,\n  -- \u0417\u043D\u0430\u0447\
  \u0435\u043D\u0438\u0435 \u043F\u0435\u0440\u0435\u043A\u043B\u044E\u0447\u0430\u0442\
  \u0435\u043B\u044F \u043A\u0430\u043A \u043A\u043E\u043B\u043E\u043D\u043A\u0430\
  : \u0444\u0438\u043B\u044C\u0442\u0440 \u043F\u043E\u0434\u0441\u0442\u0430\u0432\
  \u043B\u044F\u0435\u0442 \u0433\u0440\u0430\u0444\u0438\u043A\u0443\n  -- WHERE\
  \ measure_pick IN (...), \u0438 \u0431\u0435\u0437 \u044D\u0442\u043E\u0439 \u043A\
  \u043E\u043B\u043E\u043D\u043A\u0438 \u0437\u0430\u043F\u0440\u043E\u0441 \u0443\
  \u043F\u0430\u043B \u0431\u044B.\n  '{{ pick }}'::text AS measure_pick,\n  CASE\
  \ '{{ pick }}'\n    WHEN 'BYN (\u043E\u0442\u043F\u0443\u0441\u043A\u043D\u044B\u0435\
  )'      THEN volume_pcs * wholesale_price_byn\n    WHEN 'BYN (\u0441\u0435\u0431\
  \u0435\u0441\u0442\u043E\u0438\u043C\u043E\u0441\u0442\u044C)'  THEN volume_pcs\
  \ * cost_byn\n    ELSE volume_pcs\n  END AS measure_value\nFROM cost_calc_mv\n--\
  \ \u0412\u044B\u043F\u0443\u0441\u043A \u0441\u0447\u0438\u0442\u0430\u0435\u0442\
  \u0441\u044F \u0442\u043E\u043B\u044C\u043A\u043E \u043F\u043E \u0424\u041A\u0421\
  \u0421 (\u0437\u0430\u043A\u0430\u0437\u0447\u0438\u043A, 14.08.2026).\nWHERE cost_byn\
  \ > 0 AND cost_byn < 1000 AND wholesale_price_byn > 0\n  AND calc_sign = '\u0424\
  \u041A\u0421\u0421'"
