  \u0432\u0435\u043D\u044C \u0441\u0442\u0440\u0443\u043A\u0442\u0443\u0440\u044B\xBB\
  \ \u0431\u0435\u0440\u0451\u0442 \u0432\u0430\u0440\u0438\u0430\u043D\u0442\u044B\
  \ \u043E\u0442\u0441\u044E\u0434\u0430; \u0432\u044B\u0431\u0440\u0430\u043D\u043D\
  \u043E\u0435 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0435 \u043F\u0440\u0438\
  \u0445\u043E\u0434\u0438\u0442\n-- \u0432 mf_cost_commercial \u0447\u0435\u0440\u0435\
  \u0437 filter_values('struct_level') \u0438 \u0441\u0432\u0435\u0440\u044F\u0435\
  \u0442\u0441\u044F \u0441 \u0431\u0435\u043B\u044B\u043C \u0441\u043F\u0438\u0441\
  \u043A\u043E\u043C.\n-- \u041F\u043E\u0440\u044F\u0434\u043E\u043A \u0432 \u0444\
  \u0438\u043B\u044C\u0442\u0440\u0435 \u0437\u0430\u0434\u0430\u0451\u0442 \u043C\
  \u0435\u0442\u0440\u0438\u043A\u0430 sort_key = min(sort_order).\nSELECT '\u0411\
  \u0440\u0435\u043D\u0434-\u043C\u0435\u043D\u0435\u0434\u0436\u0435\u0440' AS struct_level,\
  \ 0 AS sort_order\nUNION ALL SELECT 'Level 01', 1\nUNION ALL SELECT 'Level 02',\
  \ 2\nUNION ALL SELECT 'Level 03', 3\nUNION ALL SELECT 'Level 04', 4\nUNION ALL SELECT\
  \ 'Level 05', 5\nUNION ALL SELECT '\u041D\u0430\u0438\u043C\u0435\u043D\u043E\u0432\
  \u0430\u043D\u0438\u0435 \u0442\u043E\u0432\u0430\u0440\u0430', 6"
