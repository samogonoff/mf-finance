sql: "-- \u0421\u041E\u041F\u041E\u0421\u0422\u0410\u0412\u0418\u041C\u0410\u042F\
  \ \u0432\u044B\u0431\u043E\u0440\u043A\u0430: \u043F\u0430\u0440\u044B \u043C\u043E\
  \u0434\u0435\u043B\u044C+\u0430\u0440\u0442\u0438\u043A\u0443\u043B, \u0443 \u043A\
  \u043E\u0442\u043E\u0440\u044B\u0445 \u0435\u0441\u0442\u044C >= 2 \u044D\u0442\u0430\
  \u043F\u043E\u0432.\n-- \u0423\u0441\u043B\u043E\u0432\u0438\u0435 \u0437\u0430\u043F\
  \u0435\u0447\u0435\u043D\u043E \u0432 SQL, \u0430 \u041D\u0415 \u0432\u044B\u043D\
  \u0435\u0441\u0435\u043D\u043E \u0432 \u0444\u0438\u043B\u044C\u0442\u0440 \u0447\
  \u0430\u0440\u0442\u0430 \u2014 \u043D\u0430\u043C\u0435\u0440\u0435\u043D\u043D\
  \u043E.\n-- \u0424\u0438\u043B\u044C\u0442\u0440\u044B \u0447\u0430\u0440\u0442\u043E\
  \u0432, \u043F\u0440\u0438\u0445\u043E\u0434\u044F\u0449\u0438\u0435 \u0447\u0435\
  \u0440\u0435\u0437 MCP, \u043C\u043E\u043B\u0447\u0430 \u043D\u0435 \u043F\u0440\
  \u0438\u043C\u0435\u043D\u044F\u044E\u0442\u0441\u044F: \u0441\u043E\u0445\u0440\
  \u0430\u043D\u044F\u044E\u0442\u0441\u044F\n-- \u0432 adhoc_filters \u043A\u043E\
  \u0440\u0440\u0435\u043A\u0442\u043D\u043E, \u043D\u043E \u0432 \u0437\u0430\u043F\
  \u0440\u043E\u0441 \u043D\u0435 \u043F\u043E\u043F\u0430\u0434\u0430\u044E\u0442\
  . \u0427\u0430\u0440\u0442 \u043E\u0442\u0434\u0430\u0432\u0430\u043B 12 639\n--\
  \ \u0441\u0442\u0440\u043E\u043A \u0432\u043C\u0435\u0441\u0442\u043E 512 \u0438\
  \ \u0432\u044B\u0433\u043B\u044F\u0434\u0435\u043B \u0434\u043E\u0441\u0442\u043E\
  \u0432\u0435\u0440\u043D\u043E. \u0427\u0442\u043E \u0437\u0430\u043F\u0435\u0447\
  \u0435\u043D\u043E \u0432 \u0432\u0438\u0442\u0440\u0438\u043D\u0443 \u2014 \u0441\
  \u043E\u0432\u0440\u0430\u0442\u044C\n-- \u043D\u0435 \u043C\u043E\u0436\u0435\u0442\
  .\n\nSELECT * FROM (\n-- \u0412\u0438\u0442\u0440\u0438\u043D\u0430: \u043F\u043E\
  \u0441\u043B\u0435\u0434\u043D\u044F\u044F \u043A\u0430\u043B\u044C\u043A\u0443\u043B\
  \u044F\u0446\u0438\u044F \u043A\u0430\u0436\u0434\u043E\u0439 \u043F\u0430\u0440\
  \u044B \u043C\u043E\u0434\u0435\u043B\u044C+\u0430\u0440\u0442\u0438\u043A\u0443\
  \u043B \u043D\u0430 \u043A\u0430\u0436\u0434\u043E\u043C \u044D\u0442\u0430\u043F\
  \u0435.\n-- \u0413\u0440\u0430\u043D\u0443\u043B\u044F\u0440\u043D\u043E\u0441\u0442\
  \u044C \u0438\u0441\u0442\u043E\u0447\u043D\u0438\u043A\u0430 \u2014 \u0441\u0442\
  \u0440\u043E\u043A\u0430 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u0430\
  /\u043E\u043F\u0435\u0440\u0430\u0446\u0438\u0438, \u043F\u043E\u044D\u0442\u043E\
  \u043C\u0443 \u0441\u043D\u0430\u0447\u0430\u043B\u0430\n-- \u0441\u0432\u043E\u0440\
  \u0430\u0447\u0438\u0432\u0430\u0435\u043C \u0434\u043E \u043A\u0430\u043B\u044C\
  \u043A\u0443\u043B\u044F\u0446\u0438\u0438 \u043F\u043E \u043D\u0430\u0442\u0443\
  \u0440\u0430\u043B\u044C\u043D\u043E\u043C\u0443 \u043A\u043B\u044E\u0447\u0443\
  , \u0412\u041A\u041B\u042E\u0427\u0410\u042F \u043D\u043E\u043C\u0435\u0440 \u0437\
  \u0430\u0434\u0430\u043D\u0438\u044F\n-- \u043F\u0440\u043E\u0438\u0437\u0432\u043E\
  \u0434\u0441\u0442\u0432\u0430: \u043E\u0434\u043D\u0430 \u043C\u043E\u0434\u0435\
  \u043B\u044C \u0432 \u0440\u0430\u0437\u043D\u044B\u0445 \u0437\u0430\u0434\u0430\
  \u043D\u0438\u044F\u0445 \u0438\u043C\u0435\u0435\u0442 \u0440\u0430\u0437\u043D\
  \u0443\u044E \u0441\u0435\u0431\u0435\u0441\u0442\u043E\u0438\u043C\u043E\u0441\u0442\
  \u044C.\n-- \u0411\u0435\u0437 \u044D\u0442\u043E\u0433\u043E SUM \u043F\u043E \u0441\
  \u044B\u0440\u043E\u0439 \u0442\u0430\u0431\u043B\u0438\u0446\u0435 \u0437\u0430\
  \u0432\u044B\u0448\u0430\u0435\u0442 \u0440\u0435\u0437\u0443\u043B\u044C\u0442\u0430\
  \u0442 \u043F\u0440\u0438\u043C\u0435\u0440\u043D\u043E \u0432 11 \u0440\u0430\u0437\
  .\n--\n-- \u0421\u0443\u043C\u043C\u044B \u0432 BYN (\u043A\u0443\u0440\u0441 \u0432\
  \ fx_rate \u2248 3). \u041E\u0442\u0441\u0435\u0447\u0435\u043D\u044B 8 \u0432\u044B\
  \u0431\u0440\u043E\u0441\u043E\u0432 >1000 \u0438 2 \u043D\u0443\u043B\u044F\n--\
  \ \u0438\u0437 86 748 \u043A\u0430\u043B\u044C\u043A\u0443\u043B\u044F\u0446\u0438\
  \u0439 \u2014 \u0438\u043C\u0435\u043D\u043D\u043E \u043E\u043D\u0438 \u043B\u043E\
  \u043C\u0430\u043B\u0438 \u0441\u0440\u0435\u0434\u043D\u0438\u0435 (avg 2040 \u043F\
  \u0440\u0438 \u043C\u0435\u0434\u0438\u0430\u043D\u0435 8).\n--\n-- stages_present\
  \ \u2014 \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u044D\u0442\u0430\u043F\u043E\
  \u0432 \u0435\u0441\u0442\u044C \u0443 \u044D\u0442\u043E\u0439 \u043F\u0430\u0440\
  \u044B. \u0414\u043B\u044F \u0447\u0435\u0441\u0442\u043D\u043E\u0433\u043E \u0441\
  \u0440\u0430\u0432\u043D\u0435\u043D\u0438\u044F\n-- \u044D\u0442\u0430\u043F\u043E\
  \u0432 \u0444\u0438\u043B\u044C\u0442\u0440\u0443\u0439\u0442\u0435 stages_present\
  \ >= 2: \u0441\u043E\u0441\u0442\u0430\u0432 \u043C\u043E\u0434\u0435\u043B\u0435\
  \u0439 \u043F\u043E \u044D\u0442\u0430\u043F\u0430\u043C \u0440\u0430\u0437\u043D\
  \u044B\u0439\n-- (\u0424\u041A\u0421\u0421 \u2014 85 \u0442\u044B\u0441. \u043A\u0430\
  \u043B\u044C\u043A\u0443\u043B\u044F\u0446\u0438\u0439, \u041F\u041A\u041F\u0421\
  \u0421 \u2014 112), \u0438 \u0441\u0440\u0430\u0432\u043D\u0435\u043D\u0438\u0435\
  \ \u043F\u043E\u043F\u0443\u043B\u044F\u0446\u0438\u0439 \u0432\u0432\u043E\u0434\
  \u0438\u0442 \u0432 \u0437\u0430\u0431\u043B\u0443\u0436\u0434\u0435\u043D\u0438\
  \u0435.\n--\n-- comparability \u2014 \u0441\u0442\u0440\u043E\u043A\u043E\u0432\u044B\
  \u0439 \u0434\u0443\u0431\u043B\u044C \u0443\u0441\u043B\u043E\u0432\u0438\u044F\
  \ stages_present >= 2. \u041D\u0443\u0436\u0435\u043D \u043F\u043E\u0442\u043E\u043C\
  \u0443,\n-- \u0447\u0442\u043E Superset \u041C\u041E\u041B\u0427\u0410 \u0432\u044B\
  \u0431\u0440\u0430\u0441\u044B\u0432\u0430\u0435\u0442 adhoc-\u0444\u0438\u043B\u044C\
  \u0442\u0440 \u0441 \u043E\u043F\u0435\u0440\u0430\u0442\u043E\u0440\u043E\u043C\
  \ '>=', \u043F\u0440\u0438\u0445\u043E\u0434\u044F\u0449\u0438\u0439\n-- \u0447\u0435\
  \u0440\u0435\u0437 MCP: \u0447\u0430\u0440\u0442 \u043E\u0442\u0434\u0430\u0432\u0430\
  \u043B 12 639 \u0441\u0442\u0440\u043E\u043A \u0432\u043C\u0435\u0441\u0442\u043E\
  \ 512 \u0438 \u0432\u044B\u0433\u043B\u044F\u0434\u0435\u043B \u043F\u0440\u0430\
  \u0432\u0434\u043E\u043F\u043E\u0434\u043E\u0431\u043D\u043E.\n-- \u0424\u0438\u043B\
  \u044C\u0442\u0440 \u0441 '=' \u043F\u043E \u0441\u0442\u0440\u043E\u043A\u0435\
  \ \u0440\u0430\u0431\u043E\u0442\u0430\u0435\u0442 \u043D\u0430\u0434\u0451\u0436\
  \u043D\u043E. \u041E\u043D \u0436\u0435 \u0443\u0434\u043E\u0431\u0435\u043D \u043A\
  \u0430\u043A \u0444\u0438\u043B\u044C\u0442\u0440 \u0434\u0430\u0448\u0431\u043E\
  \u0440\u0434\u0430.\n--\n-- level01 \u0438 brand_manager \u043E\u0441\u0442\u0430\
  \u0432\u043B\u0435\u043D\u044B \u043D\u0430\u043C\u0435\u0440\u0435\u043D\u043D\u043E\
  \ \u2014 \u044D\u0442\u043E \u043A\u043B\u044E\u0447\u0438 \u0441\u043A\u043E\u0443\
  \u043F\u0438\u043D\u0433\u0430 \u043F\u043E\u0434 \u0431\u0443\u0434\u0443\u0449\
  \u0438\u0439 RLS.\nWITH calc AS (\n  SELECT \"\u041F\u0440\u0438\u0437\u043D\u0430\
  \u043A \u043A\u0430\u043B\u044C\u043A\u0443\u043B\u044F\u0446\u0438\u0438\" AS stage,\
  \ \"\u041C\u043E\u0434\u0435\u043B\u044C\" AS model, \"\u0410\u0440\u0442\u0438\u043A\
  \u0443\u043B\" AS articul,\n         \"PLAN_ID\" AS plan_id, \"\u0434\u0430\u0442\
  \u0430 \u0440\u0430\u0441\u0447\u0435\u0442\u0430\" AS calc_date,\n         \"\u041D\
  \u043E\u043C\u0435\u0440 \u0437\u0430\u0434\u0430\u043D\u0438\u044F \u043F\u0440\
  \u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u0430\" AS zadanie,\n   \
  \      max(\"Level 01\") AS level01, max(\"\u0411\u0440\u0435\u043D\u0434-\u043C\
  \u0435\u043D\u0435\u0434\u0436\u0435\u0440\") AS brand_manager,\n         max(\"\
  \u0421\u0435\u0437\u043E\u043D\") AS season, max(\"\u0421\u0435\u043C\u044C\u044F\
  \") AS family,\n         max(\"\u0421\u0442\u0440\u0430\u043D\u0430 \u043F\u0440\
  -\u0432\u0430\") AS country, max(\"\u041D\u0430\u0438\u043C\u0435\u043D\u043E\u0432\
  \u0430\u043D\u0438\u0435 \u043C\u043E\u0434\u0435\u043B\u0438\") AS model_name,\n\
  \         max(\"\u0421\u0435\u0431\u0435\u0441\u0442\u043E\u0438\u043C\u043E\u0441\
  \u0442\u044C, \u0440\u0443\u0431.\") AS cost_byn,\n         max(\"\u041E\u0442\u043F\
  \u0443\u0441\u043A\u043D\u0430\u044F \u0446\u0435\u043D\u0430 \u043F\u043E \u0443\
  \u0440\u043E\u0432\u043D\u044E, \u0440\u0443\u0431\") AS price_byn,\n         max(\"\
  \u041E\u0441\u043D\u043E\u0432\u043D\u044B\u0435 \u043C\u0430\u0442\u0435\u0440\u0438\
  \u0430\u043B\u044B, \u0440\u0443\u0431.\") AS mat_main_byn,\n         max(\"\u0412\
  \u0441\u043F\u043E\u043C\u043E\u0433\u0430\u0442\u0435\u043B\u044C\u043D\u044B\u0435\
  \ \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u044B, \u0440\u0443\u0431.\"\
  ) AS mat_aux_byn,\n         max(\"\u041F\u043E\u0448\u0438\u0432, \u0440\u0443\u0431\
  .\") AS sew_byn, max(\"\u0420\u0430\u0441\u043A\u0440\u043E\u0439, \u0440\u0443\u0431\
  .\") AS cut_byn,\n         max(\"\u0414\u0435\u043A\u043E\u0440\u044B, \u0440\u0443\
  \u0431.\") AS decor_byn, max(\"\u0412\u044F\u0437\u0430\u043D\u0438\u0435, \u0440\
  \u0443\u0431.\") AS knit_byn,\n         max(\"\u041A\u0443\u0440\u0441 \u043D\u0430\
  \ \u0434\u0430\u0442\u0443 \u0440\u0430\u0441\u0447\u0435\u0442\u0430\") AS fx_rate\n\
  \  FROM cost_data_cache\n  GROUP BY 1,2,3,4,5,6\n), ranked AS (\n  SELECT calc.*,\
  \ row_number() over (partition by model, articul, stage order by calc_date desc)\
  \ AS rn\n  FROM calc WHERE cost_byn > 0 AND cost_byn < 1000\n), latest AS (SELECT\
  \ * FROM ranked WHERE rn = 1)\nSELECT model, articul, model_name, stage,\n  CASE\
  \ stage WHEN '\u041F\u041A\u041F\u0421\u0421' THEN 1 WHEN '\u041A\u041F\u0421\u0421\
  ' THEN 2 WHEN '\u041F\u0424\u041A\u0421\u0421' THEN 3 WHEN '\u0424\u041A\u0421\u0421\
  ' THEN 4 ELSE 9 END AS stage_order,\n  CASE stage WHEN '\u041F\u041A\u041F\u0421\
  \u0421' THEN '1. \u041F\u041A\u041F\u0421\u0421 \xB7 \u043D\u043E\u0432\u0430\u044F\
  \ \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u043A\u0430'\n             WHEN\
  \ '\u041A\u041F\u0421\u0421'  THEN '2. \u041A\u041F\u0421\u0421 \xB7 \u043F\u043B\
  \u0430\u043D\u043E\u0432\u0430\u044F \u043A\u0430\u043B\u044C\u043A\u0443\u043B\u044F\
  \u0446\u0438\u044F'\n             WHEN '\u041F\u0424\u041A\u0421\u0421' THEN '3.\
  \ \u041F\u0424\u041A\u0421\u0421 \xB7 \u0444\u0430\u043A\u0442\u0438\u0447\u0435\
  \u0441\u043A\u0430\u044F \u0440\u0430\u0441\u0446\u0435\u043D\u043A\u0430'\n   \
  \          WHEN '\u0424\u041A\u0421\u0421'  THEN '4. \u0424\u041A\u0421\u0421 \xB7\
  \ \u0438\u0441\u0442\u043E\u0440\u0438\u044F \u0441\u0435\u0431\u0435\u0441\u0442\
  \u043E\u0438\u043C\u043E\u0441\u0442\u0438'\n             ELSE stage END AS stage_label,\n\
  \  calc_date, plan_id, zadanie, level01, brand_manager, season, family, country,\n\
  \  cost_byn, price_byn, mat_main_byn, mat_aux_byn, sew_byn, cut_byn, decor_byn,\n\
  \  knit_byn, fx_rate,\n  count(*) over (partition by model, articul) AS stages_present,\n\
  \  CASE WHEN count(*) over (partition by model, articul) >= 2\n       THEN '\u0441\
  \u043E\u043F\u043E\u0441\u0442\u0430\u0432\u0438\u043C\u0430\u044F' ELSE '\u043E\
  \u0434\u0438\u043D \u044D\u0442\u0430\u043F' END AS comparability\nFROM latest\n\
  ) AS full_set\nWHERE stages_present >= 2"
