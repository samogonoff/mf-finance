sql: "-- \u0412\u0438\u0442\u0440\u0438\u043D\u0430 \u0441\u0442\u043E\u0438\u0442\
  \ \u043D\u0430 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u0438\u0437\u043E\
  \u0432\u0430\u043D\u043D\u043E\u043C \u043F\u0440\u0435\u0434\u0441\u0442\u0430\u0432\
  \u043B\u0435\u043D\u0438\u0438 cost_calc_mv (\u043C\u0438\u0433\u0440\u0430\u0446\
  \u0438\u044F 0036),\n-- \u0430 \u043D\u0435 \u043D\u0430 cost_data_cache. \u0421\
  \u0432\u0451\u0440\u0442\u043A\u0430 \u043C\u0438\u043B\u043B\u0438\u043E\u043D\u0430\
  \ \u0441\u0442\u0440\u043E\u043A \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\
  \u043E\u0432 \u0434\u043E 87 \u0442\u044B\u0441.\n-- \u043A\u0430\u043B\u044C\u043A\
  \u0443\u043B\u044F\u0446\u0438\u0439 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\
  \u0435 \u0434\u0435\u043B\u0430\u0435\u0442\u0441\u044F \u043D\u0430 \u043A\u0430\
  \u0436\u0434\u044B\u0439 \u0437\u0430\u043F\u0440\u043E\u0441: 60 \u043C\u0441 \u043F\
  \u0440\u043E\u0442\u0438\u0432 1277 \u043C\u0441,\n-- \u0447\u0438\u0441\u043B\u0430\
  \ \u0438\u0434\u0435\u043D\u0442\u0438\u0447\u043D\u044B (\u0441\u0432\u0435\u0440\
  \u0435\u043D\u043E 13.08.2026).\n--\n-- \u041E\u0431\u043D\u043E\u0432\u043B\u044F\
  \u0435\u0442\u0441\u044F \u043F\u043E\u0441\u043B\u0435 refresh \u043A\u044D\u0448\
  \u0430 \u0440\u0430\u0437\u0434\u0435\u043B\u0430 \u2014 \u0441\u043C. refresh_calc_mv()\
  \ \u0432 app/db.py.\n-- \u0415\u0441\u043B\u0438 \u0446\u0438\u0444\u0440\u044B\
  \ \u043A\u0430\u0436\u0443\u0442\u0441\u044F \u0432\u0447\u0435\u0440\u0430\u0448\
  \u043D\u0438\u043C\u0438, \u0441\u043C\u043E\u0442\u0440\u0435\u0442\u044C \u043D\
  \u0430\u0434\u043E \u0442\u0443\u0434\u0430, \u0430 \u043D\u0435 \u0441\u044E\u0434\
  \u0430.\n--\n-- \u0421\u0443\u043C\u043C\u044B *_byn \u0432 \u0431\u0435\u043B\u043E\
  \u0440\u0443\u0441\u0441\u043A\u0438\u0445 \u0440\u0443\u0431\u043B\u044F\u0445\
  \ (\u043A\u0443\u0440\u0441 \u0432 fx_rate \u2248 3).\n--\n-- \u041E\u0442\u0441\
  \u0435\u0447\u0435\u043D\u044B \u043A\u0430\u043B\u044C\u043A\u0443\u043B\u044F\u0446\
  \u0438\u0438 \u0441 \u043D\u0443\u043B\u0435\u0432\u043E\u0439 \u0441\u0435\u0431\
  \u0435\u0441\u0442\u043E\u0438\u043C\u043E\u0441\u0442\u044C\u044E \u0438 \u0432\
  \u044B\u0431\u0440\u043E\u0441\u044B \u0441\u0432\u044B\u0448\u0435 1000 BYN:\n\
  -- \u0438\u0445 8-10 \u0438\u0437 87 \u0442\u044B\u0441., \u043D\u043E \u0438\u043C\
  \u0435\u043D\u043D\u043E \u043E\u043D\u0438 \u043B\u043E\u043C\u0430\u043B\u0438\
  \ \u0441\u0440\u0435\u0434\u043D\u0438\u0435 (avg 2040 \u043F\u0440\u0438 \u043C\
  \u0435\u0434\u0438\u0430\u043D\u0435 8).\n\n-- \u0421\u041E\u041F\u041E\u0421\u0422\
  \u0410\u0412\u0418\u041C\u0410\u042F \u0432\u044B\u0431\u043E\u0440\u043A\u0430\
  : \u043F\u0430\u0440\u044B \u043C\u043E\u0434\u0435\u043B\u044C+\u0430\u0440\u0442\
  \u0438\u043A\u0443\u043B, \u0443 \u043A\u043E\u0442\u043E\u0440\u044B\u0445 \u0435\
  \u0441\u0442\u044C >= 2 \u044D\u0442\u0430\u043F\u043E\u0432.\n-- \u0423\u0441\u043B\
  \u043E\u0432\u0438\u0435 \u0437\u0430\u043F\u0435\u0447\u0435\u043D\u043E \u0432\
  \ SQL, \u0430 \u041D\u0415 \u0432\u044B\u043D\u0435\u0441\u0435\u043D\u043E \u0432\
  \ \u0444\u0438\u043B\u044C\u0442\u0440 \u0447\u0430\u0440\u0442\u0430 \u2014 \u043D\
  \u0430\u043C\u0435\u0440\u0435\u043D\u043D\u043E: \u0444\u0438\u043B\u044C\u0442\
  \u0440\u044B\n-- \u0447\u0430\u0440\u0442\u043E\u0432, \u043F\u0440\u0438\u0445\u043E\
  \u0434\u044F\u0449\u0438\u0435 \u0447\u0435\u0440\u0435\u0437 MCP, \u043C\u043E\u043B\
  \u0447\u0430 \u043D\u0435 \u043F\u0440\u0438\u043C\u0435\u043D\u044F\u044E\u0442\
  \u0441\u044F (\u0441\u043E\u0445\u0440\u0430\u043D\u044F\u044E\u0442\u0441\u044F\
  \ \u0432\n-- adhoc_filters, \u043D\u043E \u0432 \u0437\u0430\u043F\u0440\u043E\u0441\
  \ \u043D\u0435 \u043F\u043E\u043F\u0430\u0434\u0430\u044E\u0442). \u0427\u0430\u0440\
  \u0442 \u043E\u0442\u0434\u0430\u0432\u0430\u043B 12 639 \u0441\u0442\u0440\u043E\
  \u043A \u0432\u043C\u0435\u0441\u0442\u043E\n-- 512 \u0438 \u0432\u044B\u0433\u043B\
  \u044F\u0434\u0435\u043B \u0434\u043E\u0441\u0442\u043E\u0432\u0435\u0440\u043D\u043E\
  . \u0427\u0442\u043E \u0437\u0430\u043F\u0435\u0447\u0435\u043D\u043E \u0432 \u0432\
  \u0438\u0442\u0440\u0438\u043D\u0443, \u0441\u043E\u0432\u0440\u0430\u0442\u044C\
  \ \u043D\u0435 \u043C\u043E\u0436\u0435\u0442.\nSELECT * FROM (\nWITH ranked AS\
  \ (\n  SELECT cost_calc_mv.*,\n         row_number() over (partition by model, articul,\
  \ calc_sign\n                            order by calc_date desc) AS rn\n  FROM\
  \ cost_calc_mv\n  WHERE cost_byn > 0 AND cost_byn < 1000\n), latest AS (SELECT *\
  \ FROM ranked WHERE rn = 1)\nSELECT model, articul, model_name, calc_sign AS stage,\n\
  \  CASE calc_sign WHEN '\u041F\u041A\u041F\u0421\u0421' THEN 1 WHEN '\u041A\u041F\
  \u0421\u0421' THEN 2\n                 WHEN '\u041F\u0424\u041A\u0421\u0421' THEN\
  \ 3 WHEN '\u0424\u041A\u0421\u0421' THEN 4 ELSE 9 END AS stage_order,\n  CASE calc_sign\
  \ WHEN '\u041F\u041A\u041F\u0421\u0421' THEN '1. \u041F\u041A\u041F\u0421\u0421\
  \ \xB7 \u043D\u043E\u0432\u0430\u044F \u0440\u0430\u0437\u0440\u0430\u0431\u043E\
  \u0442\u043A\u0430'\n                 WHEN '\u041A\u041F\u0421\u0421'  THEN '2.\
  \ \u041A\u041F\u0421\u0421 \xB7 \u043F\u043B\u0430\u043D\u043E\u0432\u0430\u044F\
  \ \u043A\u0430\u043B\u044C\u043A\u0443\u043B\u044F\u0446\u0438\u044F'\n        \
  \         WHEN '\u041F\u0424\u041A\u0421\u0421' THEN '3. \u041F\u0424\u041A\u0421\
  \u0421 \xB7 \u0444\u0430\u043A\u0442\u0438\u0447\u0435\u0441\u043A\u0430\u044F \u0440\
  \u0430\u0441\u0446\u0435\u043D\u043A\u0430'\n                 WHEN '\u0424\u041A\
  \u0421\u0421'  THEN '4. \u0424\u041A\u0421\u0421 \xB7 \u0438\u0441\u0442\u043E\u0440\
  \u0438\u044F \u0441\u0435\u0431\u0435\u0441\u0442\u043E\u0438\u043C\u043E\u0441\u0442\
  \u0438'\n                 ELSE calc_sign END AS stage_label,\n  calc_date, plan_id,\
  \ zadanie, level01, brand_manager, season, family, country,\n  color, volume_pcs,\
  \ is_ambiguous, material_rows,\n  cost_byn, wholesale_price_byn AS price_byn, retail_price_byn,\n\
  \  cost_usd, wholesale_price_usd, retail_price_usd,\n  mat_main_byn, mat_aux_byn,\
  \ sewing_byn, cutting_byn, decor_byn, knitting_byn,\n  fx_rate,\n  count(*) over\
  \ (partition by model, articul) AS stages_present,\n  CASE WHEN count(*) over (partition\
  \ by model, articul) >= 2\n       THEN '\u0441\u043E\u043F\u043E\u0441\u0442\u0430\
  \u0432\u0438\u043C\u0430\u044F' ELSE '\u043E\u0434\u0438\u043D \u044D\u0442\u0430\
  \u043F' END AS comparability\nFROM latest\n) AS full_set\nWHERE stages_present >=\
  \ 2"
