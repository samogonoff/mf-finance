sql: "-- \u0412\u0438\u0442\u0440\u0438\u043D\u0430 \u043F\u043E\u0434 \u0434\u0430\
  \u0448\u0431\u043E\u0440\u0434 \xAB\u041A\u043E\u043C\u043C\u0435\u0440\u0447\u0435\
  \u0441\u043A\u0430\u044F \u044D\u0444\u0444\u0435\u043A\u0442\u0438\u0432\u043D\u043E\
  \u0441\u0442\u044C \u0438 \u0446\u0435\u043D\u043E\u043E\u0431\u0440\u0430\u0437\
  \u043E\u0432\u0430\u043D\u0438\u0435\xBB.\n-- \u0421\u0442\u043E\u0438\u0442 \u043D\
  \u0430 cost_calc_mv (\u043C\u0438\u0433\u0440\u0430\u0446\u0438\u044F 0036) \u2014\
  \ \u0441\u0432\u0451\u0440\u0442\u043A\u0430 \u0434\u043E \u043A\u0430\u043B\u044C\
  \u043A\u0443\u043B\u044F\u0446\u0438\u0438 \u0443\u0436\u0435 \u0441\u0434\u0435\
  \u043B\u0430\u043D\u0430.\n--\n-- WHERE \u043D\u0438\u0436\u0435 \u0437\u0430\u0434\
  \u0430\u0451\u0442 \u0411\u0410\u0417\u0423 \u0420\u0410\u0421\u0427\u0401\u0422\
  \u0410, \u0438 \u0435\u0451 \u043D\u0430\u0434\u043E \u043F\u043E\u043A\u0430\u0437\
  \u044B\u0432\u0430\u0442\u044C \u043D\u0430 \u0434\u0430\u0448\u0431\u043E\u0440\
  \u0434\u0435:\n--   * cost_byn > 0 \u0438 wholesale_price_byn > 0 \u2014 \u043D\u0430\
  \u0446\u0435\u043D\u043A\u0443 \u0438\u043D\u0430\u0447\u0435 \u043D\u0435 \u043F\
  \u043E\u0441\u0447\u0438\u0442\u0430\u0442\u044C.\n--     \u0421\u0435\u0431\u0435\
  \u0441\u0442\u043E\u0438\u043C\u043E\u0441\u0442\u044C \u043F\u0443\u0441\u0442\u0430\
  \ \u0443 36% \u043A\u0430\u043B\u044C\u043A\u0443\u043B\u044F\u0446\u0438\u0439\
  , \u043E\u0442\u043F\u0443\u0441\u043A\u043D\u0430\u044F \u0446\u0435\u043D\u0430\
  \ \u0443 38%; \u043E\u0431\u0435\n--     \u0437\u0430\u043F\u043E\u043B\u043D\u0435\
  \u043D\u044B \u0443 53 922 \u0438\u0437 87 184, \u0442\u043E \u0435\u0441\u0442\u044C\
  \ \u0443 61%.\n--   * cost_byn < 1000 \u2014 \u043E\u0442\u0441\u0435\u0447\u0435\
  \u043D\u0438\u0435 \u0432\u044B\u0431\u0440\u043E\u0441\u043E\u0432. \u0418\u0445\
  \ 8-10 \u0448\u0442\u0443\u043A, \u043D\u043E \u043F\u0440\u0438 \u043C\u0435\u0434\
  \u0438\u0430\u043D\u0435 ~2\n--     \u043E\u043D\u0438 \u0437\u0430\u0434\u0438\u0440\
  \u0430\u044E\u0442 \u0441\u0440\u0435\u0434\u043D\u0438\u0435 \u0432 \u0440\u0430\
  \u0437\u044B \u0438 \u043C\u0435\u043D\u044F\u044E\u0442 \u043F\u043E\u0440\u044F\
  \u0434\u043E\u043A \u044D\u0442\u0430\u043F\u043E\u0432 \u043C\u0435\u0441\u0442\
  \u0430\u043C\u0438.\n-- \u041F\u043B\u0438\u0442\u043A\u0430 \u0431\u0435\u0437\
  \ \u0443\u043A\u0430\u0437\u0430\u043D\u0438\u044F \u0431\u0430\u0437\u044B \u0447\
  \u0438\u0442\u0430\u0435\u0442\u0441\u044F \u043A\u0430\u043A \u043A\u0430\u0440\
  \u0442\u0438\u043D\u0430 \u043F\u043E \u0432\u0441\u0435\u043C\u0443 \u0430\u0441\
  \u0441\u043E\u0440\u0442\u0438\u043C\u0435\u043D\u0442\u0443.\n--\n-- \u0414\u0412\
  \u0415 \u0414\u0410\u0422\u042B, \u0418 \u041E\u041D\u0418 \u041F\u0420\u041E \u0420\
  \u0410\u0417\u041D\u041E\u0415 (\u0440\u0435\u0448\u0435\u043D\u0438\u0435 \u0437\
  \u0430\u043A\u0430\u0437\u0447\u0438\u043A\u0430 14.08.2026 \u2014 \u0430\u043D\u0430\
  \u043B\u0438\u0437\u0438\u0440\u0443\u0435\u043C \u043F\u043E\n-- \u0434\u0430\u0442\
  \u0435 \u0432\u044B\u043F\u0443\u0441\u043A\u0430):\n--   * production_date \xAB\
  \u0434\u0430\u0442\u0430 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\
  \u0432\u0430\xBB \u2014 \u043A\u043E\u0433\u0434\u0430 \u0438\u0437\u0434\u0435\u043B\
  \u0438\u0435 \u0432\u044B\u043F\u0443\u0449\u0435\u043D\u043E. \u0411\u0438\u0437\
  \u043D\u0435\u0441-\u0434\u0430\u0442\u0430,\n--     2024-2026 \u0441 \u0440\u043E\
  \u0432\u043D\u044B\u043C \u0440\u0430\u0441\u043F\u0440\u0435\u0434\u0435\u043B\u0435\
  \u043D\u0438\u0435\u043C \u043F\u043E \u043C\u0435\u0441\u044F\u0446\u0430\u043C\
  . \u0413\u043E\u0434, \u043C\u0435\u0441\u044F\u0446 \u0438 \u0434\u0438\u043D\u0430\
  \u043C\u0438\u043A\u0430\n--     \u0441\u0447\u0438\u0442\u0430\u044E\u0442\u0441\
  \u044F \u043F\u043E \u043D\u0435\u0439 (prod_year, prod_month_num, prod_month).\n\
  --   * calc_date \xAB\u0434\u0430\u0442\u0430 \u0440\u0430\u0441\u0447\u0451\u0442\
  \u0430\xBB \u2014 \u043A\u043E\u0433\u0434\u0430 \u043A\u0430\u043B\u044C\u043A\u0443\
  \u043B\u044F\u0446\u0438\u044E \u043F\u043E\u0441\u0447\u0438\u0442\u0430\u043B\u0438\
  . \u0422\u0435\u0445\u043D\u0438\u0447\u0435\u0441\u043A\u0438\u0439 \u0448\u0442\
  \u0430\u043C\u043F\n--     \u0438\u0441\u0442\u043E\u0447\u043D\u0438\u043A\u0430\
  : \u043E\u0431\u043D\u043E\u0432\u043B\u0435\u043D\u0438\u0435 \u043A\u044D\u0448\
  \u0430 \u043F\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\
  \ \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u0438\u0435 \u043C\u0435\u0441\u044F\
  \u0446\u044B, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u0412\u0421\u0415\n--\
  \     87 \u0442\u044B\u0441. \u043A\u0430\u043B\u044C\u043A\u0443\u043B\u044F\u0446\
  \u0438\u0439 \u043B\u0435\u0436\u0430\u0442 \u0432 \u043E\u0434\u043D\u043E\u043C\
  -\u0434\u0432\u0443\u0445 \u043C\u0435\u0441\u044F\u0446\u0430\u0445. \u0420\u0430\
  \u0437\u0440\u0435\u0437 \u043F\u043E \u043D\u0435\u0439 \u0434\u0430\u0451\u0442\
  \ \u043E\u0434\u0438\u043D\n--     \u0433\u043E\u0434 \u0438 \u0442\u0440\u0438\
  \ \u0442\u043E\u0447\u043A\u0438 \u043D\u0430 \u0433\u0440\u0430\u0444\u0438\u043A\
  \u0435. \u041E\u0441\u0442\u0430\u0432\u043B\u0435\u043D\u0430 \u0434\u043B\u044F\
  \ \u0441\u043F\u0440\u0430\u0432\u043A\u0438, \u0432 \u0444\u0438\u043B\u044C\u0442\
  \u0440\u044B \u043D\u0435 \u0438\u0434\u0451\u0442.\n--\n-- other_byn \u2014 \u043E\
  \u0441\u0442\u0430\u0442\u043E\u043A \xAB\u043F\u0440\u043E\u0447\u0435\u0435\xBB\
  . \u0421\u043E\u0441\u0442\u0430\u0432\u043B\u044F\u044E\u0449\u0438\u0435 (\u043C\
  \u0430\u0442\u0435\u0440\u0438\u0430\u043B\u044B, \u043F\u043E\u0448\u0438\u0432\
  , \u0440\u0430\u0441\u043A\u0440\u043E\u0439,\n-- \u0434\u0435\u043A\u043E\u0440\
  \u044B, \u0432\u044F\u0437\u0430\u043D\u0438\u0435) \u041D\u0415 \u0441\u043A\u043B\
  \u0430\u0434\u044B\u0432\u0430\u044E\u0442\u0441\u044F \u0432 \u0441\u0435\u0431\
  \u0435\u0441\u0442\u043E\u0438\u043C\u043E\u0441\u0442\u044C: \u0441\u043E\u0432\
  \u043F\u0430\u0434\u0430\u044E\u0442 \u043B\u0438\u0448\u044C \u0432 4,8%\n-- \u0441\
  \u043B\u0443\u0447\u0430\u0435\u0432, \u043C\u0435\u0434\u0438\u0430\u043D\u0430\
  \ \u043E\u0442\u043D\u043E\u0448\u0435\u043D\u0438\u044F 0,791. \u0411\u0435\u0437\
  \ \u043E\u0441\u0442\u0430\u0442\u043A\u0430 \u0441\u0442\u0435\u043A\u043E\u0432\
  \u044B\u0439 \u0431\u0430\u0440 \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044F\
  \ \u043A\u0430\u043A\n-- \u0440\u0430\u0437\u043B\u043E\u0436\u0435\u043D\u0438\u0435\
  \ \u043D\u0430 100% \u0438 \u0432\u0440\u0451\u0442 \u043D\u0430 \u043F\u044F\u0442\
  \u0443\u044E \u0447\u0430\u0441\u0442\u044C. \u0427\u0442\u043E \u0438\u043C\u0435\
  \u043D\u043D\u043E \u0432 \u043E\u0441\u0442\u0430\u0442\u043A\u0435 \u2014 \u0432\
  \u043E\u043F\u0440\u043E\u0441\n-- \u043A \u0438\u0441\u0442\u043E\u0447\u043D\u0438\
  \u043A\u0443, \u043D\u0435 \u0432\u044B\u044F\u0441\u043D\u0435\u043D\u043E.\n--\n\
  -- markup_byn \u2014 \u043D\u0430\u0446\u0435\u043D\u043A\u0430 \u043E\u0442 \u041E\
  \u0422\u041F\u0423\u0421\u041A\u041D\u041E\u0419 \u0446\u0435\u043D\u044B (\u0440\
  \u0435\u0448\u0435\u043D\u0438\u0435 \u0437\u0430\u043A\u0430\u0437\u0447\u0438\u043A\
  \u0430 13.08.2026).\n-- \u0420\u043E\u0437\u043D\u0438\u0447\u043D\u0430\u044F \u0430\
  \u043D\u0430\u043B\u0438\u0437\u0438\u0440\u0443\u0435\u0442\u0441\u044F \u043E\u0442\
  \u0434\u0435\u043B\u044C\u043D\u043E, \u0432 \u043E\u0434\u043D\u0438\u0445 \u043F\
  \u043B\u0438\u0442\u043A\u0430\u0445 \u0431\u0430\u0437\u044B \u043D\u0435 \u0441\
  \u043C\u0435\u0448\u0438\u0432\u0430\u0435\u043C.\nSELECT\n  model, articul, model_name,\
  \ calc_sign, calc_date,\n  production_date,\n  date_trunc('month', production_date)\
  \     AS prod_month,\n  to_char(production_date, 'YYYY')         AS prod_year,\n\
  \  to_char(production_date, 'MM')           AS prod_month_num,\n  to_char(production_date,\
  \ 'MM') || ' \xB7 ' || (ARRAY[\n    '\u044F\u043D\u0432\u0430\u0440\u044C','\u0444\
  \u0435\u0432\u0440\u0430\u043B\u044C','\u043C\u0430\u0440\u0442','\u0430\u043F\u0440\
  \u0435\u043B\u044C','\u043C\u0430\u0439','\u0438\u044E\u043D\u044C',\n    '\u0438\
  \u044E\u043B\u044C','\u0430\u0432\u0433\u0443\u0441\u0442','\u0441\u0435\u043D\u0442\
  \u044F\u0431\u0440\u044C','\u043E\u043A\u0442\u044F\u0431\u0440\u044C','\u043D\u043E\
  \u044F\u0431\u0440\u044C','\u0434\u0435\u043A\u0430\u0431\u0440\u044C'\n  ])[extract(month\
  \ from production_date)::int] AS prod_month_name,\n  season, country, level01, level02,\
  \ level03, level04, level05,\n  brand_manager, family, price_level, color,\n  volume_pcs,\n\
  \  cost_byn, wholesale_price_byn, retail_price_byn,\n  cost_usd, wholesale_price_usd,\
  \ retail_price_usd,\n  mat_main_byn, mat_aux_byn, sewing_byn, cutting_byn, decor_byn,\
  \ knitting_byn,\n  greatest(\n    cost_byn - (coalesce(mat_main_byn,0) + coalesce(mat_aux_byn,0)\n\
  \              + coalesce(sewing_byn,0) + coalesce(cutting_byn,0)\n            \
  \  + coalesce(decor_byn,0) + coalesce(knitting_byn,0)), 0\n  ) AS other_byn,\n \
  \ wholesale_price_byn - cost_byn AS markup_byn,\n  is_ambiguous\nFROM cost_calc_mv\n\
  WHERE cost_byn > 0 AND cost_byn < 1000 AND wholesale_price_byn > 0"
