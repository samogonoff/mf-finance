  \u043E\u0432 (x_axis Superset \u0432 \u0441\u043F\u0438\u0441\u043E\u043A \u043A\
  \u043E\u043B\u043E\u043D\u043E\u043A \u0434\u0430\u0448\u0431\u043E\u0440\u0434\u0430\
  \ \u043D\u0435 \u0431\u0435\u0440\u0451\u0442), \u0438 \u0431\u0435\u0437 \u044D\
  \u0442\u043E\u0433\u043E \u0447\u0438\u043F \u043A\u0440\u043E\u0441\u0441-\u0444\
