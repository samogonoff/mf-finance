slice_name: "marg-09 \xB7 \u0414\u0438\u043D\u0430\u043C\u0438\u043A\u0430 \u043C\u0430\
  \u0440\u0436\u0438\u043D\u0430\u043B\u044C\u043D\u043E\u0441\u0442\u0438, %"
description: "\u041C\u0430\u0440\u0436\u0438\u043D\u0430\u043B\u044C\u043D\u043E\u0441\
  \u0442\u044C = \u043C\u0430\u0440\u0436\u0430 / \u0432\u044B\u043F\u0443\u0441\u043A\
  \ \u0432 \u043E\u0442\u043F\u0443\u0441\u043A\u043D\u044B\u0445 \u0446\u0435\u043D\
  \u0430\u0445, \u0432\u0437\u0432\u0435\u0448\u0435\u043D\u043D\u0430\u044F \u043F\
  \u043E \u0442\u0438\u0440\u0430\u0436\u0443. \u041A\u0440\u0430\u0441\u043D\u0430\
  \u044F \u043B\u0438\u043D\u0438\u044F \u2014 \u043D\u043E\u0440\u043C\u0430 \u043F\
  \u043E Level 01 \u0438\u0437 \u0442\u0430\u0440\u0433\u0435\u0442\u043E\u0432 \u0440\
  \u0430\u0437\u0434\u0435\u043B\u0430; \u0434\u043B\u044F \u043A\u0430\u043A\u043E\
  \u0439 \u0434\u043E\u043B\u0438 \u0432\u044B\u043F\u0443\u0441\u043A\u0430 \u043E\
  \u043D\u0430 \u0437\u0430\u0434\u0430\u043D\u0430 \u2014 \u0432 \u043F\u043B\u0438\
  \u0442\u043A\u0435 \xAB\u041C\u0430\u0440\u0436\u0438\u043D\u0430\u043B\u044C\u043D\
  \u043E\u0441\u0442\u044C \u0432\u044B\u043F\u0443\u0441\u043A\u0430\xBB."
