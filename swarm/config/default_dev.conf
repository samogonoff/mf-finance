map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# === Frontend (Nuxt 3) ===
# При прямом заходе на http://finance.local — Nuxt с HMR через WS.
server {
    listen 80;
    server_name finance.local localhost;

    # Server-route /api/auth/b24/callback живёт в самом Nuxt (server/api),
    # поэтому весь /api префикс HTTP-запросов отдаём в Nuxt; Go-API — на отдельном
    # хосте api.finance.local. Это симметрично с тем, как сделано в MP.
    location / {
        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite/Nuxt HMR — нужен upgrade websocket'ов.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;
    }

    error_log /var/log/nginx/finance_error.log;
    access_log /var/log/nginx/finance_access.log;
}

# === Backend (Go API) ===
# Прямой доступ к Go-API через api.finance.local — фронт ходит сюда напрямую
# (NUXT_PUBLIC_API_BASE), Nuxt-server-routes ходят во внутренний http://nginx.
server {
    listen 80;
    server_name api.finance.local;

    # Раздел «Себестоимость» живёт в отдельном compose (docker-compose.cost.yml),
    # python-cost подключён к swarm_finance_dev_network вторым интерфейсом, поэтому
    # резолвится по имени. Если cost-стэк не поднят — отдадим 502 (это явный
    # сигнал, а не «странный go-api 404»).
    location /api/cost/ {
        proxy_pass http://python-cost:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://go-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-роуты (если появятся: /api/ws/...)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;
    }

    error_log /var/log/nginx/api_finance_error.log;
    access_log /var/log/nginx/api_finance_access.log;
}
