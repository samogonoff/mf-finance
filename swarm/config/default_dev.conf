map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# === Frontend (Nuxt 3) ===
# При прямом заходе на http://finance.local — Nuxt с HMR через WS.
server {
    listen 80;
    server_name finance.local localhost;

    # Server-route /api/auth/b24/callback живёт в самом Nuxt (server/api),
    # поэтому весь /api префикс HTTP-запросов отдаём в Nuxt; Go-API — на отдельном
    # хосте api.finance.local. Это симметрично с тем, как сделано в MP.
    # === Раздел «Бюджетирование» — обособленный контур ===
    # Контур живёт в своём репозитории (budget) и поднимается своим compose;
    # контейнер budget-app должен быть подключён к swarm_finance_dev_network —
    # как python-cost. resolver + переменная: если контур не поднят, получаем
    # 502 на /budget/, а не падение nginx при старте.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $budget_upstream http://budget-app:8080;

    # Гейт раздела. Контур токен НЕ проверяет и прав не раздаёт — решение
    # принимает здесь nginx подзапросом в Go-API, а контуру уходит уже готовая
    # identity заголовками X-Auth-*.
    #
    # Наружу auth_request пропускает как есть только 401 и 403; любой другой
    # ответ (404, 502, таймаут) превращается в 500 у пользователя — поэтому
    # /api/auth/check отвечает исключительно 200/401/403.
    location = /internal/budget-auth {
        internal;
        proxy_pass http://go-api:8080/api/auth/check?role=ROLE_BUDGET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /budget/api/ {
        auth_request /internal/budget-auth;
        auth_request_set $budget_user_id $upstream_http_x_auth_user_id;
        auth_request_set $budget_email   $upstream_http_x_auth_email;
        auth_request_set $budget_name    $upstream_http_x_auth_name;
        auth_request_set $budget_roles   $upstream_http_x_auth_roles;

        # Заголовки ставим поверх клиентских: подделать identity нельзя.
        # Пустое значение переменной = заголовок не уйдёт вовсе (и контур
        # ответит 401), поэтому «протечь» присланному клиентом нечему.
        proxy_set_header X-Auth-User-Id $budget_user_id;
        proxy_set_header X-Auth-Email   $budget_email;
        proxy_set_header X-Auth-Name    $budget_name;
        proxy_set_header X-Auth-Roles   $budget_roles;
        proxy_set_header X-Request-Id   $request_id;

        # Префикс срезаем: внутри контура пути живут от корня (/api/...).
        rewrite ^/budget/(.*)$ /$1 break;
        proxy_pass $budget_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика раздела не гейтится: токен видит только JS, который дёргает API.
    location /budget/ {
        rewrite ^/budget/(.*)$ /$1 break;
        proxy_pass $budget_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /budget {
        absolute_redirect off;   # TLS терминируется выше — иначе Location уйдёт на http://
        return 301 /budget/;
    }

    location / {
        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite/Nuxt HMR — нужен upgrade websocket'ов.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;
    }

    error_log /var/log/nginx/finance_error.log;
    access_log /var/log/nginx/finance_access.log;
}

# === Backend (Go API) ===
# Прямой доступ к Go-API через api.finance.local — фронт ходит сюда напрямую
# (NUXT_PUBLIC_API_BASE), Nuxt-server-routes ходят во внутренний http://nginx.
server {
    listen 80;
    server_name api.finance.local;

    # Раздел «Себестоимость» живёт в отдельном compose (docker-compose.cost.yml),
    # python-cost подключён к swarm_finance_dev_network вторым интерфейсом, поэтому
    # резолвится по имени. Если cost-стэк не поднят — отдадим 502 (это явный
    # сигнал, а не «странный go-api 404»).
    # Используем resolver + переменную, чтобы nginx не падал при старте, если
    # python-cost ещё не запущен.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $cost_upstream http://python-cost:8091;
    location /api/cost/ {
        proxy_pass $cost_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://go-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-роуты (если появятся: /api/ws/...)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;
    }

    error_log /var/log/nginx/api_finance_error.log;
    access_log /var/log/nginx/api_finance_access.log;
}
